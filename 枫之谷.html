function trySpawnMerchant(){
  let hasMerchant = false;
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) if (state.map[r][c].type === 'merchant'){ hasMerchant = true; break; }
  if (hasMerchant) return;
  if (Math.random() > 0.015) return;
  const empties = [];
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) if ((state.map[r][c].type === 'empty' || state.map[r][c].type === 'grass') && !isNearPlayerMaple(r,c)) empties.push([r,c]);
  if (!empties.length) return;
  const [r,c] = empties[Math.floor(Math.random()*empties.length)];
  const origType = state.map[r][c].type;
  const stock = [...MERCHANT_STOCK].sort(()=>Math.random()-0.5).slice(0,3);
  state.merchant = {r, c, origType, items: stock.map(s => ({...s, sold:false})), expire: Date.now() + 5*60*1000};
  state.map[r][c] = makeCell('merchant', {originalType: origType});
  updateCell(r,c);
  logEgg('═══════════════════════════');

  save();
}
function removeMerchant(){

function openMerchant(){

  const m = $('modal');
  
  // 1. 渲染商品列表 HTML 的函数
  const getGoodsHTML = () => {
    return state.merchant.items.map((item, i) => {

      if (id === 'bowl_rice_gold' || id === 'bread_gold') return true;

    });

      else if (id === 'bowl_rice_gold') price = 500;
      else if (id === 'bread_gold') price = 300;
      else if (id.includes('_gold')) price = 200;

        if (state.coins < item.price) return;
        
        state.coins -= item.price;
        item.sold = true;
        
        if (item.id === '__stamina_potion__'){
          state.stamina = Math.min(state.staminaMax, state.stamina + 50);

          addItem('seed_mystery', 1);
          logEgg('🧙 获得了【神秘种子】——种下后必出金穗！');
        } else if (item.id === '__lucky_box__'){
          const boxPool = [['diamond', 40], ['moonstone', 25], ['emerald', 15], ['sapphire', 5], ['stardust_fragment', 10], ['stardust', 3], ['iron_watermelon', 2]];
          const win = weightedPick(boxPool);

          if (['diamond','moonstone','emerald','sapphire'].includes(win)) unlockCodex('ore', win);
          else unlockCodex('rare', win);

          addItem(item.id, item.amt || 1);
          log(`🧙 购买了 ${def(item.id).name} ×${item.amt||1}（-${item.price}💰）`);
        }

      };

        renderAll(); save(); updateUI(); // 更新 UI
      };
    });
  };

  // 4. 核心更新 UI 的方法（不重绘整个弹窗，只替换内容）
  const updateUI = () => {
    const remain = Math.max(0, Math.floor((state.merchant.expire - Date.now()) / 1000));
    const timeEl = m.querySelector('#merchant-time');
    if (timeEl) timeEl.textContent = `剩余 ${remain}s`;
    
    // 如果时间到了，自动关门赶人
    if (remain <= 0) {
      clearInterval(merchantInterval);
      removeMerchant();
      closeModal();
      logEgg('🧙 商人摇了摇头，消失在迷雾中……');
      return;
    }

    // 获取最新的 HTML
    const goodsHTML = getGoodsHTML();

    let changed = false;

    }

      bindEvents(); // 只要有任意一个列表刷新了，就重新绑定事件
    }
  };

  // 5. 第一次打开面板
  openModal(`<h2>🧙 神秘商人<span id="merchant-time" style="color:var(--red);font-weight:bold">剩余 ${Math.max(0, Math.floor((state.merchant.expire - Date.now()) / 1000))}s</span></h2>

    <div class="craftList" id="sellList">${getSellHTML()}</div>
    <div class="modalFoot"><button class="btn" id="mClose">离开</button></div>`,
    (modalEl) => {
      modalEl.querySelector('#mClose').onclick = () => { clearInterval(merchantInterval); closeModal(); };
      bindEvents(); // 第一次绑定事件
    }
  );

  // 6. 启动 1 秒心跳，专门用来扣倒计时和自动刷新状态
  merchantInterval = setInterval(updateUI, 1000);
}

function migrateGachaWish(){
  // 找当前 gacha 位置
  let curGacha = null;
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++){
    if (state.map[r][c].type === 'gacha') curGacha = [r,c];
  }
  
  const gachaTarget = [2, 1];
  const inRange = (pos, tgt) => pos && Math.abs(pos[0]-tgt[0]) <= 1 && Math.abs(pos[1]-tgt[1]) <= 1;
  
  let changed = false;
  
  // 如果 gacha 不在目标位置，删掉旧的
  if (curGacha && !inRange(curGacha, gachaTarget)){
    state.map[curGacha[0]][curGacha[1]] = makeCell('empty');
    changed = true;
    curGacha = null;
  }
  
  // 如果没有 gacha，放到左上角附近
  if (!curGacha){
    const spots = [];
    for (let dr=-1;dr<=1;dr++) for (let dc=-1;dc<=1;dc++) spots.push([gachaTarget[0]+dr, gachaTarget[1]+dc]);
    for (let r2=0;r2<=5;r2++) for (let c2=0;c2<=5;c2++) spots.push([r2, c2]);
    for (const [r,c] of spots){
      if (r<0||r>=ROWS||c<0||c>=COLS) continue;
      const t = state.map[r][c].type;
      if (t === 'empty' || t === 'grass' || t === 'sand' || t === 'clay' || t === 'flower'){
        state.map[r][c] = makeCell('gacha');
        changed = true;
        break;
      }
    }
  }
  
  // wish_well 保持原位不动，只有在完全没有时才补一个到右上角
  let hasWish = false;
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) if (state.map[r][c].type === 'wish_well'){ hasWish = true; break; }
  if (!hasWish){
    const wishSpots = [[2,23],[2,22],[1,23],[1,22],[3,23],[3,22]];
    for (const [r,c] of wishSpots){
      if (r<0||r>=ROWS||c<0||c>=COLS) continue;
      const t = state.map[r][c].type;
      if (t === 'empty' || t === 'grass' || t === 'sand' || t === 'clay' || t === 'flower'){
        state.map[r][c] = makeCell('wish_well');
        changed = true;
        break;
      }
    }
  }
  
  if (changed){ if (cellEls.length) renderMapAll(); save(); log('🏗️ 扭蛋机移到左上角，许愿池保留在右上角'); }
}

  }

  if (!state.playerName){
    buildMapDom(); renderAll(); checkLateNightEgg(); rollWeatherAndEvent(); genDailyTasks();
    setTimeout(() => openNameSetup(), 300);
    return;
  }

  checkLateNightEgg();
  rollWeatherAndEvent();
  genDailyTasks();
  snapshotBackup();
  buildMapDom();
  renderAll();
}

$('map').addEventListener('click', e => { const el = e.target.closest('.cell'); if (!el) return; onCellClick(+el.dataset.r, +el.dataset.c); });
$('btnEat').onclick = openEatMenu;
$('btnCodex').onclick = openCodex;
$('btnSave').onclick = openSaveManager;
$('btnCheckin').onclick = openCheckin;
$('btnGuide').onclick = openGuide;
$('btnReset').onclick = () => {
  if (!confirm('确定重置所有进度？此操作不可撤销！')) return;
  _isResetting = true;
  window.removeEventListener('beforeunload', save);
  try { for (const k of Object.keys(localStorage)) if (k.startsWith('bloxd_farm_save')) localStorage.removeItem(k); } catch(e){}
  location.reload();
};

init();
</script>
</body>
</html>
