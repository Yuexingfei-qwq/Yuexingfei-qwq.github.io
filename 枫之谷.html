<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>枫之谷</title>
<style>
:root{--bg:#f5f7fa;--panel:#fff;--panel2:#eef1f5;--line:#d8dee6;--text:#1f2530;--dim:#6b7684;--gold:#c99a00;--green:#2f9e4f;--blue:#2c6fd1;--purple:#7a3fc0;--red:#d63a3a;--stam:#e08a2a;--rain:#4d8bf0;--snow:#9ad4f5;--sun:#f5c542;--thunder:#7a3fc0}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;overflow:hidden}
#topbar{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:5px;white-space:nowrap;font-size:13px}
.stat b{color:var(--gold);font-size:15px}
.barWrap{flex:1;max-width:150px;height:16px;background:#d8dee6;border-radius:8px;position:relative;overflow:hidden}
#xpfill{height:100%;width:0;background:linear-gradient(90deg,#4d8bf0,#a06cf0);transition:width .3s}
#staminaFill{height:100%;width:100%;background:linear-gradient(90deg,#e08a2a,#f5c542);transition:width .3s}
.barWrap span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;text-shadow:0 1px 2px #000;font-weight:600}
.spacer{flex:1}
#weatherBadge{font-size:12px;padding:2px 8px;border-radius:10px;border:1px solid var(--line);background:var(--panel2)}
#main{flex:1;display:flex;overflow:hidden;min-height:0}
#mapWrap{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:14px}
#map{display:grid;gap:1px;background:#c8d0da;border:1px solid var(--line);border-radius:8px;padding:4px;flex:0 0 auto}
.cell{width:34px;height:34px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;user-select:none;background:#e8ecf1;transition:transform .08s,background .15s;position:relative}
.cell:hover{transform:scale(1.07);background:#d0d8e2;z-index:2}
.cell.empty{background:#e8ecf1}.cell.dirt{background:#b89b6e}.cell.farmland{background:#7a5a30}
.cell.water{background:#7eb8e0}
.cell.grass{background:#a8d4a0}.cell.flower{background:#e8ecf1}
.cell.flower.on-dirt{background:#b89b6e}
.cell.flower.on-farmland{background:#7a5a30}.cell.tree{background:#8fbf85}.cell.rock{background:#b8bec8}
.cell.sand{background:#e8d49a}.cell.clay{background:#c8b8a8}
.cell.sapling{background:#c8d8a0}
.cell.workbench,.cell.chest,.cell.shop,.cell.artisan,.cell.gacha{background:#e0c888}
.cell.furnace{background:#c8b088}
.cell.wish_well{background:#b8d8f0}
.cell.enchant_low,.cell.enchant_high{background:#c8b0e8}
.cell.enchant_low.locked,.cell.enchant_high.locked{background:#b8b8c8;color:#666}
.cell.animal{background:#c0d8a8}
.cell.animal.hasLove{background:linear-gradient(135deg,#ffe6f0,#f0c8a8)}
.cell.mutant::after{content:'⚡';position:absolute;top:-2px;left:-2px;font-size:14px;text-shadow:0 0 4px #a06cf0, 0 0 2px #fff;z-index:5;pointer-events:none}
.cell.merchant{background:#f0c8ff;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #a06cf0aa;}50%{box-shadow:0 0 0 6px #a06cf000;}}
.cell .hpbar{position:absolute;bottom:2px;left:3px;right:3px;height:3px;background:#0003;border-radius:2px;overflow:hidden}
.cell .hpbar i{display:block;height:100%;background:var(--green)}
.cell .lovebar{position:absolute;top:1px;left:3px;right:3px;height:2px;background:#0003;border-radius:2px;overflow:hidden}
.cell .lovebar i{display:block;height:100%;background:#e93d82}
#sidebar{width:300px;flex:0 0 auto;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto}
.panel{border-bottom:1px solid var(--line);padding:10px 12px}
.panel h3{margin:0 0 8px;font-size:11px;color:var(--dim);letter-spacing:1.5px;font-weight:600;display:flex;justify-content:space-between}
.invGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.invItem{aspect-ratio:1;background:var(--panel2);border:1px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;font-size:16px;transition:.12s}
.invItem:hover{border-color:var(--blue);transform:translateY(-2px)}
.invItem.sel{border-color:var(--gold);box-shadow:0 0 0 2px #c99a0055}
.invItem.gold-item{background:linear-gradient(135deg,#fff8e0,#ffe6a0);border-color:var(--gold)}
.invItem .cnt{position:absolute;bottom:0;right:2px;font-size:10px;text-shadow:0 1px 3px #fff,0 0 3px #fff;color:#1f2530;font-weight:600}
.invItem .eat{position:absolute;top:-4px;left:-4px;font-size:11px;background:#fff;border:1px solid var(--line);border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.invItem .eat:hover{background:#fff4d6;border-color:var(--gold)}
.invItem .lock{position:absolute;top:-4px;right:-4px;font-size:10px;width:15px;height:15px;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line);border-radius:50%;cursor:pointer;opacity:0;transition:.12s;z-index:3}
.invItem:hover .lock{opacity:.75}
.invItem.locked{box-shadow:inset 0 0 0 2px var(--gold)}
.invItem.locked .lock{opacity:1;border-color:var(--gold);color:var(--gold)}
.toolRow{display:flex;justify-content:space-between;font-size:12px;padding:2px 0;color:var(--dim)}
.toolRow b{color:var(--text);font-weight:500}
.codexRow{display:flex;justify-content:space-between;font-size:12px;padding:3px 0}
.codexRow span:last-child{color:var(--gold)}
.taskRow{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin-bottom:6px;font-size:11px}
.taskRow .tt{display:flex;justify-content:space-between;margin-bottom:3px}
.taskRow .tb{height:4px;background:#d8dee6;border-radius:2px;overflow:hidden}
.taskRow .tb i{display:block;height:100%;background:var(--green)}
.taskRow .tr{color:var(--gold)}
.taskRow.done{border-color:var(--gold);background:#fff9e6}
.taskRow .claim{cursor:pointer;color:var(--gold);font-weight:600}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;transition:.12s}
.btn:hover{background:#e0e6ee;border-color:var(--blue)}
.btn.gold{border-color:var(--gold);color:var(--gold)}.btn.gold:hover{background:#fff4d6}
.btn.stam{border-color:var(--stam);color:var(--stam)}.btn.stam:hover{background:#fff1dc}
.btn.save{border-color:var(--blue);color:var(--blue)}.btn.save:hover{background:#e8eef6}
.btn.purple{border-color:var(--purple);color:var(--purple)}.btn.purple:hover{background:#f5eeff}
.btn:disabled{opacity:.5;cursor:not-allowed}
#log{height:100px;flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line);padding:6px 14px;overflow-y:auto;font-size:12px;color:var(--dim);font-family:ui-monospace,monospace}
#log div{margin-bottom:1px}
#log .egg-msg{color:#a06cf0;font-weight:600;text-shadow:0 0 8px #a06cf055}
#log .event-msg{color:#2c6fd1}
#modal{position:fixed;inset:0;background:#00000055;display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
#modal.hidden{display:none}
.modalBox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;max-width:720px;max-height:82vh;overflow-y:auto;min-width:400px;box-shadow:0 8px 32px #0002}
.modalBox h2{margin:0 0 12px;font-size:16px;display:flex;justify-content:space-between;align-items:baseline}
.modalBox h2 span{font-size:12px;color:var(--dim);font-weight:400}
.tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--line);padding-bottom:8px}
.tab{padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px;border:1px solid transparent}
.tab:hover{background:var(--panel2)}
.tab.active{background:var(--panel2);border-color:var(--blue);color:var(--blue);font-weight:600}
.craftList{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.craftItem{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:.12s}
.craftItem:hover{border-color:var(--blue);background:#e8eef6}
.craftItem.dis{opacity:.45;cursor:not-allowed}
.craftItem.dis:hover{border-color:var(--line);background:var(--panel2)}
.craftItem .ci{font-size:22px;flex:0 0 auto}
.craftItem .cn{flex:1;min-width:0}
.craftItem .cn b{display:block;font-size:12px;font-weight:500}
.craftItem .cn small{color:var(--dim);font-size:10px}
.modalFoot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.saveTextarea{width:100%;height:180px;font-family:ui-monospace,monospace;font-size:11px;padding:8px;border:1px solid var(--line);border-radius:6px;resize:vertical;background:var(--panel2);color:var(--text)}
.gacha-result{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0}
.gacha-cell{padding:8px 4px;border:1px solid var(--line);border-radius:8px;text-align:center;font-size:11px;background:var(--panel2)}
.gacha-cell .gi{font-size:24px;display:block}
.gacha-cell.t1{border-color:#bbb}
.gacha-cell.t2{border-color:#4d8bf0;background:#e8f0ff}
.gacha-cell.t3{border-color:#2f9e4f;background:#eafce8}
.gacha-cell.t4{border-color:#a06cf0;background:#f5eeff}
.gacha-cell.t5{border-color:#c99a00;background:linear-gradient(135deg,#fff8e0,#ffe6a0)}
.gacha-cell.t6{border-color:#e93d82;background:linear-gradient(135deg,#ffe0ee,#ffd0e0);font-weight:600}
.checkin-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:12px 0}
.checkin-cell{padding:10px 4px;border:1px solid var(--line);border-radius:6px;text-align:center;font-size:11px;background:var(--panel2)}
.checkin-cell.done{background:#eafce8;border-color:var(--green)}
.checkin-cell.today{border-color:var(--gold);box-shadow:0 0 0 2px #c99a0055}
.checkin-cell .cd{font-size:18px;display:block;margin-bottom:4px}
.nameColorRow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.colorSwatch{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);cursor:pointer;transition:.12s}
.colorSwatch:hover{transform:scale(1.15)}
.colorSwatch.sel{border-color:#000;box-shadow:0 0 0 2px #fff inset}
.nameInput{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:14px;background:var(--panel2);color:var(--text);margin:6px 0}
</style>
</head>
<body>

<header id="topbar">
  <div class="stat" id="playerNameBox">🏷️ <b id="playerName">—</b></div>
  <div class="stat">💰 <b id="coins">0</b></div>
  <div class="stat">⭐ Lv.<b id="level">1</b></div>
  <div class="barWrap"><div id="xpfill"></div><span id="xptext">0 / 50</span></div>
  <div class="stat">⚡ <b id="stamNum">100</b></div>
  <div class="barWrap" style="max-width:110px"><div id="staminaFill"></div><span id="stamText">100/100</span></div>
  <div id="weatherBadge">☀️ 晴朗</div>
  <div class="spacer"></div>
  <div class="stat" id="toolInfo">⛏️ 木镐</div>
</header>

<main id="main">
  <section id="mapWrap"><div id="map"></div></section>
  <aside id="sidebar">
    <div class="panel"><h3>背包</h3><div class="invGrid" id="inventory"></div></div>
    <div class="panel" style="display:flex;gap:6px">
      <button class="btn stam" id="btnEat" style="flex:1">🍴 进食</button>
      <button class="btn" id="btnCodex" style="flex:1">📖 图鉴</button>
    </div>
    <div class="panel" style="display:flex;gap:6px">
      <button class="btn save" id="btnSave" style="flex:1">💾 存档</button>
      <button class="btn purple" id="btnCheckin" style="flex:1">📅 签到</button>
    </div>
    <div class="panel" style="display:flex;gap:6px">
      <button class="btn" id="btnGuide" style="flex:1; border-color:var(--gold); color:var(--gold); font-weight:600;">📜 新手指引</button>
    </div>
    <div class="panel"><h3>工具</h3>
      <div class="toolRow"><span>⛏️ 镐子</span><b id="tPick">木镐</b></div>
      <div class="toolRow"><span>🪓 斧头</span><b id="tAxe">未拥有</b></div>
      <div class="toolRow"><span>🎣 鱼竿</span><b id="tRod">未拥有</b></div>
      <div class="toolRow"><span>🌾 镰刀</span><b id="tSickle">未拥有</b></div>
      <div style="border-top:1px solid var(--line);margin:6px 0"></div>
      <div class="toolRow"><span>🔮 低级附魔台</span><b id="tEnchLow">🔒 未解锁</b></div>
      <div class="toolRow"><span>✨ 高级附魔台</span><b id="tEnchHigh">🔒 未解锁</b></div>
      <div style="border-top:1px solid var(--line);margin:6px 0"></div>
      <div class="toolRow"><span>⛏️ 星辰镐</span><b id="tDivinePick">未拥有</b></div>
      <div class="toolRow"><span>🌾 丰饶锄</span><b id="tDivineHoe">未拥有</b></div>
      <div class="toolRow"><span>🎣 海神竿</span><b id="tDivineRod">未拥有</b></div>
      <div class="toolRow"><span>🌌 星辉冠</span><b id="tDivineCrown">未拥有</b></div>
      <div class="toolRow"><span>☄️ 陨星镐</span><b id="tDivineMeteorPick">未拥有</b></div>
      <div class="toolRow"><span>☀️ 太阳圣袍</span><b id="tDivineSunRobe">未拥有</b></div>
    </div>
    <div class="panel"><h3>每日任务 <span id="dailyDate" style="color:var(--dim);font-weight:400"></span></h3>
      <div id="dailyTasks"></div>
    </div>
    <div class="panel"><h3>图鉴进度</h3><div id="codexSummary"></div></div>
    <div class="panel" style="display:flex;gap:6px">
      <button class="btn" id="btnReset" style="flex:1">🔄 重置</button>
    </div>
  </aside>
</main>

<footer id="log"></footer>
<div id="modal" class="hidden"></div>

<script>
const COLS=24, ROWS=16, TILE=34;
const SAVE_KEY = 'bloxd_farm_save';
const SAVE_VERSION = 21;
const LEGACY_SAVE_KEYS = ['bloxd_farm_save_v15','bloxd_farm_save_v14','bloxd_farm_save_v13','bloxd_farm_save_v12','bloxd_farm_save_v11','bloxd_farm_save_v10','bloxd_farm_save_v9','bloxd_farm_save_v8','bloxd_farm_save_v7','bloxd_farm_save_v6','bloxd_farm_save_v5','bloxd_farm_save_v4','bloxd_farm_save_v3','bloxd_farm_save_v2','bloxd_farm_save_v1'];
const NAME_COLORS = ['#1f2530','#d63a3a','#e08a2a','#c99a00','#2f9e4f','#2c6fd1','#7a3fc0','#e93d82'];

const ITEMS = {
  fiber:{name:'纤维',icon:'🌿',sell:1},
  stone:{name:'石头',icon:'⛰️',sell:2}, coal:{name:'煤炭',icon:'⬛',sell:10},
  iron_ore:{name:'铁矿石',icon:'⚪',sell:15}, iron_ingot:{name:'铁锭',icon:'⚙️',sell:30},
  gold_ore:{name:'金矿石',icon:'🟡',sell:40}, gold_ingot:{name:'金锭',icon:'🥇',sell:80},
  diamond:{name:'钻石',icon:'💎',sell:220}, moonstone:{name:'月石',icon:'🌙',sell:600},
  emerald:{name:'绿宝石',icon:'💚',sell:900}, sapphire:{name:'蓝宝石',icon:'🔷',sell:2200},
  clay:{name:'粘土',icon:'🟫',sell:5}, sand:{name:'沙子',icon:'🟨',sell:4},
  glass:{name:'玻璃',icon:'💠',sell:12}, terracotta:{name:'陶瓦',icon:'🧱',sell:18},
  plank:{name:'木板',icon:'🟧',sell:9},
  iron_bucket:{name:'铁桶',icon:'🛢️',sell:20, color:'#c0c0c0'},
  water_bucket:{name:'水桶',icon:'🧺',sell:25, color:'#7eb8e0'},
  egg:{name:'鸡蛋',icon:'🥚',sell:5, food:2}, milk:{name:'牛奶',icon:'🥛',sell:14, food:3},
  wool:{name:'羊毛',icon:'☁️',sell:6},
  wheat:{name:'小麦',icon:'🌾',sell:8}, rice:{name:'米',icon:'🍚',sell:10},
  watermelon_slice:{name:'西瓜片',icon:'🍉',sell:5, food:1},
  bowl:{name:'碗',icon:'🥣',sell:0, noSell:true},
  bowl_rice:{name:'碗装大米',icon:'🍚',sell:40, food:12},
  bowl_rice_gold:{name:'金穗碗装大米',icon:'🍚',sell:120, food:36, color:'#f5c542'},

  bread:{name:'面包',icon:'🍞',sell:25, food:10},
  bread_gold:{name:'金穗面包',icon:'🍞',sell:75, food:30, color:'#f5c542'},
  bread_mutant:{name:'变异面包',icon:'🍞',sell:50, food:20, color:'#a06cf0'},
  apple:{name:'苹果',icon:'🍎',sell:15, food:3},
  maple_sapling:{name:'枫树苗',icon:'🌱',sell:15},
  maple_log:{name:'枫木原木',icon:'🌲',sell:6},
  wheat_gold:{name:'金穗小麦',icon:'✨',sell:40, color:'#f5c542'},
  rice_gold:{name:'金穗大米',icon:'✨',sell:50, color:'#f5c542'},
  watermelon_gold:{name:'金穗西瓜',icon:'✨',sell:25, food:5, color:'#f5c542'},
  watermelon_mutant:{name:'变异西瓜',icon:'🍉',sell:15, food:3, color:'#a06cf0'},

  rice_mutant:{name:'变异大米',icon:'🍚',sell:30, color:'#a06cf0'}, 
  stardust:{name:'星尘',icon:'🌟',sell:5000, egg:true},
  stardust_fragment:{name:'星尘碎片',icon:'✴️',sell:1000, color:'#f5c542'},

const PRO_SOURCE = {
  stone:'pick', coal:'pick', iron_ore:'pick', iron_ingot:'pick',
  gold_ore:'pick', gold_ingot:'pick', diamond:'pick', moonstone:'pick',
  emerald:'pick', sapphire:'pick', stardust:'pick',
  maple_log:'axe', maple_sapling:'axe', apple:'axe',
  fish_small:'rod', fish_carp:'rod', fish_gold:'rod', fish_legend:'rod',
};

const FLOWERS = {
  poppy:{name:'虞美人',icon:'🌺',rarity:1,weight:18},
  red_tulip:{name:'红郁金香',icon:'🌹',rarity:1,weight:18},
  orange_tulip:{name:'橙郁金香',icon:'🌼',rarity:2,weight:13},
  dandelion:{name:'蒲公英',icon:'🌻',rarity:1,weight:18},
  tallgrass:{name:'高草',icon:'🌿',rarity:1,weight:18},
  forget_me_not:{name:'勿忘我',icon:'💙',rarity:2,weight:12},
  bluebell:{name:'蓝铃花',icon:'🔵',rarity:2,weight:12},
  allium:{name:'葱兰',icon:'💜',rarity:3,weight:8},
  pink_tulip:{name:'粉郁金香',icon:'🌷',rarity:2,weight:14},

  daisy:{name:'雏菊',icon:'🌼',rarity:1,weight:18},
  cactus:{name:'仙人掌',icon:'🌵',rarity:2,weight:10},
};

const FARM_R0 = 7, FARM_R1 = 15, FARM_C0 = 3, FARM_C1 = 11;
function inFarmArea(r, c){ return r >= FARM_R0 && r <= FARM_R1 && c >= FARM_C0 && c <= FARM_C1; }
function isNearPlayerMaple(r, c){
  for (let dr=-1;dr<=1;dr++) for (let dc=-1;dc<=1;dc++){
    const nr=r+dr, nc=c+dc;

function weightedPick(pairs){

function scheduleSpawn(cellType, delayMs, extraData){
  setTimeout(() => {
    const empties = [];
    for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++){
      if (state.map[r][c] && state.map[r][c].type === 'empty' && !isNearPlayerMaple(r,c)) empties.push([r,c]);
    }
    if (!empties.length) return;
    const [r,c] = empties[Math.floor(Math.random()*empties.length)];
    state.map[r][c] = makeCell(cellType, extraData);
    updateCell(r,c);
  }, delayMs);
}
function makeCell(type, extra={}){

}
function genMap(){
  const m = [];
  for (let r=0;r<ROWS;r++){ const row = []; for (let c=0;c<COLS;c++) row.push(makeCell('empty')); m.push(row); }
  for (let r=7;r<=15;r++) for (let c=3;c<=11;c++) m[r][c] = makeCell('dirt');
  let riverC = 19;
  for (let r=0;r<ROWS;r++){
    riverC += randInt(-1,1);
    riverC = Math.max(15, Math.min(19, riverC));
    const width = Math.random() < 0.45 ? 4 : 3;
    for (let w=0;w<width;w++){ const cc = riverC + w; if (cc < 0 || cc >= COLS) continue; m[r][cc] = Math.random() < 0.3 ? makeCell('clay') : makeCell('water'); }
    if (riverC-1 >= 0 && m[r][riverC-1].type === 'empty') m[r][riverC-1] = makeCell('sand');
    const right = riverC + width;
    if (right < COLS && m[r][right].type === 'empty') m[r][right] = makeCell('sand');
  }
  m[5][3]=makeCell('workbench'); m[5][4]=makeCell('artisan'); m[5][5]=makeCell('chest');
  m[5][6]=makeCell('shop'); m[5][7]=makeCell('furnace'); m[5][8]=makeCell('enchant_low');
m[5][9]=makeCell('enchant_high');
m[2][1]=makeCell('gacha'); m[2][23]=makeCell('wish_well');
  m[6][3]=makeCell('animal', {animal:'chicken'}); m[6][4]=makeCell('animal', {animal:'cow'}); m[6][5]=makeCell('animal', {animal:'sheep'});
  const flowerPairs = Object.entries(FLOWERS).map(([k,v])=>['flower_'+k, v.weight]);
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++){
    if (m[r][c].type !== 'empty') continue;
    const roll = Math.random();
    if (roll < 0.08) m[r][c] = makeCell('tree', {hp:16, maxHp:16});
    else if (roll < 0.22) m[r][c] = makeCell('grass');
    else if (roll < 0.35) m[r][c] = makeCell('flower', {variant: weightedPick(flowerPairs).replace('flower_','')});
    else if (roll < 0.46){ const o = weightedPick(ORE_WEIGHTS); m[r][c] = makeCell('rock', {variant:o, hp:ORES[o].hp, maxHp:ORES[o].hp}); }
  }
  state.map = m;
}

function cellIcon(d){
  switch (d.type){
    case 'grass': return '🌿';
    case 'flower': return FLOWERS[d.variant]?.icon || '🌼';
    case 'tree': return '🌳';
    case 'rock': return ORES[d.variant]?.icon || '⛰️';
    case 'water': return '🌊'; case 'sand': return '🟨'; case 'clay': return '🟫';
    case 'workbench': return '🛠️'; case 'artisan': return '🎨'; case 'chest': return '📦';
    case 'wish_well': return '⛲';
    case 'shop': return '🏪'; case 'furnace': return '🔥'; case 'gacha': return '🎰';
    case 'enchant_low': return state.enchLowUnlocked ? '🔮' : '🔒';
    case 'enchant_high': return state.enchHighUnlocked ? '✨' : '🔒';
    case 'animal': return d.animal==='chicken'?'🐔':d.animal==='cow'?'🐄':d.animal==='sheep'?'🐑':'🐾';
    case 'merchant': return '🧙';
    case 'sapling': return d.saplingStage >= 1 ? '🌿' : '🌱';
    case 'dirt': case 'farmland':
      if (d.crop){
        if (!d.crop.watered) return '💧';
        if (d.crop.lucky) {
          return d.crop.stage >= CROPS[d.crop.id].grow ? '🎁' : '🍀';
        }
        const cd = CROPS[d.crop.id];
        const p = d.crop.stage / cd.grow;
        const baseIcon = p >= 1 ? cd.icon : (p > 0.5 ? '🌿' : '🌱');
        return baseIcon;
      }
      return '';
    default: return '';
  }
}
function updateCell(r,c){
  if (!cellEls[r]) return;
  const d = state.map[r][c];
  const el = cellEls[r][c];
  if (!el) return;
  let cls = 'cell ' + d.type;
  if (d.type === 'flower' && d.originalType) cls += ' on-' + d.originalType;
  if (d.type === 'enchant_low' && !state.enchLowUnlocked) cls += ' locked';
  if (d.type === 'enchant_high' && !state.enchHighUnlocked) cls += ' locked';
  if (d.type === 'animal' && d.love >= 5) cls += ' hasLove';
  if ((d.type === 'dirt' || d.type === 'farmland') && d.crop && d.crop.mutant) cls += ' mutant';
  el.className = cls;
  el.textContent = cellIcon(d);
  if (d.type === 'dirt' || d.type === 'farmland'){
    if (d.crop && d.crop.mutant) el.style.boxShadow = 'inset 0 0 0 2px #a06cf0, 0 0 6px #a06cf088';
    else if (d.crop && d.crop.lucky) el.style.boxShadow = 'inset 0 0 0 2px #f5c542, 0 0 6px #f5c54288';
    else el.style.boxShadow = '';
  }
  el.querySelector('.hpbar')?.remove();
  el.querySelector('.lovebar')?.remove();
  if ((d.type === 'rock' || d.type === 'tree') && d.hp < d.maxHp && d.maxHp > 0){
    const bar = document.createElement('div'); bar.className = 'hpbar';
    const i = document.createElement('i'); i.style.width = (d.hp / d.maxHp * 100) + '%';
    bar.appendChild(i); el.appendChild(bar);
  }
  if (d.type === 'animal' && d.love > 0){
    const bar = document.createElement('div'); bar.className = 'lovebar';
    const i = document.createElement('i'); i.style.width = Math.min(100, d.love / 5 * 100) + '%';
    bar.appendChild(i); el.appendChild(bar);
  }
}

function sellOne(id){
  const it = def(id);
  if (state.locked[id]){ log(`🔒 ${it.name} 已上锁，先解锁才能出售`); return; }
  if (!hasItem(id, 1)) return;
  removeItem(id, 1);
  let price = it.sell;
  const proBonus = getProBonus(id);
  if (proBonus > 0) price = Math.floor(price * (1 + proBonus));
  if (state.dailyEvent.buff === 'sell_bonus') price = Math.floor(price * 1.2);
  if (state.divineSunRobe) price = Math.floor(price * 1.5);
  state.coins += price;
  progressTask('sell');
  log(`💵 卖出 ${it.name} +${price}💰`);
  renderTop(); renderInventory();
}

function genDailyTasks(){

  if (state.taskDate === today && state.tasks.length === 3) return;
  state.taskDate = today;
  const pool = [...TASK_POOL].sort(()=>Math.random()-0.5);
  state.tasks = pool.slice(0,3).map(t => ({...t, progress:0, claimed:false}));
  save();
}
function renderDailyTasks(){
  const box = $('dailyTasks');
  $('dailyDate').textContent = state.taskDate || '';
  if (!state.tasks.length){ box.innerHTML = '<div style="color:var(--dim);font-size:11px">加载中…</div>'; return; }
  box.innerHTML = state.tasks.map((t,i) => {
    const done = t.progress >= t.target;
    const pct = Math.min(100, t.progress/t.target*100);
    return `<div class="taskRow ${done?'done':''}"><div class="tt"><span>${t.name}</span><span>${t.progress}/${t.target} ${done && !t.claimed ? '<span class="claim" data-idx="'+i+'">领取</span>' : done ? '✅' : ''}</span></div><div class="tb"><i style="width:${pct}%"></i></div><div class="tr">奖励：💰${t.reward.coins} ⭐${t.reward.xp}</div></div>`;
  }).join('');
  box.querySelectorAll('.claim').forEach(el => {
    el.onclick = () => {
      const t = state.tasks[+el.dataset.idx];
      if (!t || t.claimed || t.progress < t.target) return;
      t.claimed = true;
      state.coins += t.reward.coins;
      gainXp(t.reward.xp);
      log(`📋 完成任务「${t.name}」 +${t.reward.coins}💰 +${t.reward.xp}⭐`);
      renderAll(); save();

function progressTask(type, key){
  for (const t of state.tasks){
    if (t.claimed) continue;
    if (t.type === type && (!t.key || t.key === key)){ t.progress++; renderDailyTasks(); }
  }
}

const CODEX_REWARD = {
  ore: id => ORES[id]?.reward ?? 30,
  crop: id => ({wheat:30,rice:50,watermelon:80,maple:200,bowl_rice:150,bread:100,wheat_gold:120,rice_gold:150,watermelon_gold:120,wheat_mutant:150,rice_mutant:180,watermelon_mutant:150,bread_gold:200,bread_mutant:150,bowl_rice_gold:250,bowl_rice_mutant:200}[id] ?? 50),
  dye: id => { const r = DYE_RECIPES.find(x=>x.color===id); return r ? 40*(r.flowers.length) : 60; },
  dyed: id => 80 * (id.split('_').length),
  flower: id => {
    const key = id.replace('flower_', '');
    const f = FLOWERS[key];
    return f ? 20 * f.rarity : 20;
  },
  fish: id => ({fish_small:30, fish_carp:60, fish_gold:150, fish_legend:500}[id] ?? 50),
  rare: id => ({stardust:2000, iron_watermelon:1500, golden_egg:150, rainbow_wool:120, stardust_fragment:80}[id] ?? 50),
};
const CODEX_LABEL = { ore:'矿石', crop:'作物', dye:'染料', dyed:'染色物' };
function getCodexName(cat, id) {
  if (cat === 'ore') return ORES[id]?.name || def(id).name;
  if (cat === 'crop') {
    if (id === 'maple') return '枫树';
    if (id === 'watermelon') return '西瓜';
    return CROPS[id]?.name || def(id).name;
  }
  if (cat === 'dye') {
    const r = DYE_RECIPES.find(x => x.color === id);
    return r ? r.name + '染料' : def(id).name;
  }
  return def(id).name;
}
function unlockCodex(cat, id){
  if (state.codex[cat][id]) return false;
  state.codex[cat][id] = true;
  const reward = CODEX_REWARD[cat](id);
  state.coins += reward;
  log(`📖 图鉴解锁 · ${CODEX_LABEL[cat]}「${getCodexName(cat, id)}」 +${reward}💰`);
  renderAll(); return true;
}

function defaultCodex(){ return {ore:{},crop:{},dye:{},dyed:{},flower:{},fish:{},rare:{}}; }
function sanitizeCell(cell){
  const c = Object.assign({type:'empty', variant:null, hp:0, maxHp:0, crop:null, respawn:0, animal:null, saplingStage:0, saplingCounter:0, saplingSpeed:'normal', feedCd:0, originalType:null, love:0, loveFed:'', planted:false}, cell || {});

    c.crop.mutant = !!c.crop.mutant;
    c.crop.lucky = !!c.crop.lucky;
  }
  return c;
}
function sanitizeSaveData(d){
  if (!d || typeof d !== 'object') return null;
  const out = {};
  out.playerName = typeof d.playerName === 'string' ? d.playerName : null;
  out.playerNameColor = typeof d.playerNameColor === 'string' ? d.playerNameColor : NAME_COLORS[0];
  out.coins = typeof d.coins === 'number' && isFinite(d.coins) ? d.coins : 0;
out.xp = typeof d.xp === 'number' && isFinite(d.xp) ? d.xp : 0;
out.level = typeof d.level === 'number' && isFinite(d.level) ? d.level : 0;
out.stamina = typeof d.stamina === 'number' && isFinite(d.stamina) ? d.stamina : 100;
out.staminaMax = typeof d.staminaMax === 'number' && isFinite(d.staminaMax) ? d.staminaMax : 100;
  out.pickaxe = typeof d.pickaxe === 'number' ? d.pickaxe : 1;
  out.axe = typeof d.axe === 'number' ? d.axe : 0;
  out.rod = typeof d.rod === 'number' ? d.rod : 0;
  out.hasSickle = !!d.hasSickle;
  const tools = defaultTools();
  if (d.tools && typeof d.tools === 'object'){
    for (const k of Object.keys(tools)){
      const t = d.tools[k];
      if (t && typeof t === 'object') tools[k] = {eff: typeof t.eff === 'number' ? t.eff : 0, for: typeof t.for === 'number' ? t.for : 0, pro: typeof t.pro === 'number' ? t.pro : 0};
    }
  }
  out.tools = tools;
  out.locked = d.locked && typeof d.locked === 'object' ? d.locked : {};
out.chest  = d.chest  && typeof d.chest  === 'object' ? {...d.chest}  : {};
  out.inv = d.inv && typeof d.inv === 'object' ? d.inv : {};
  const INV_FIX = { 'rice_seed':'seed_rice', 'wheat_seed':'seed_wheat', 'watermelon_seed':'seed_watermelon' };
  for (const [bad, good] of Object.entries(INV_FIX)){
    if (out.inv[bad]){ out.inv[good] = (out.inv[good]||0) + out.inv[bad]; delete out.inv[bad]; }
    if (out.chest[bad]){ out.chest[good] = (out.chest[good]||0) + out.chest[bad]; delete out.chest[bad]; }
  }
  delete out.inv.ench_low; delete out.inv.ench_high; delete out.chest.ench_low; delete out.chest.ench_high;
  delete out.inv.wood; delete out.chest.wood;
  for (const k of Object.keys(out.chest)){ if (k.startsWith('dyed_')){ if (out.chest[k] > 1) out.chest[k] = 1; if (out.chest[k] < 1) delete out.chest[k]; } }
  const codex = defaultCodex();
  if (d.codex && typeof d.codex === 'object')    for (const cat of ['ore','crop','dye','dyed','flower','fish','rare']) if (d.codex[cat] && typeof d.codex[cat] === 'object') codex[cat] = d.codex[cat];
  // 迁移：把误塞进 crop 的鱼移到 fish
  const FISH_IDS = ['fish_small','fish_carp','fish_gold','fish_legend'];
  for (const f of FISH_IDS){
    if (codex.crop[f]){
      codex.fish[f] = true;
      delete codex.crop[f];
    }
  }
  out.codex = codex;
  out.tasks = Array.isArray(d.tasks) ? d.tasks : [];
  out.taskDate = typeof d.taskDate === 'string' ? d.taskDate : '';
  out.hasBowlEver = !!d.hasBowlEver;
  out.enchLowUnlocked = !!d.enchLowUnlocked;
  out.enchHighUnlocked = !!d.enchHighUnlocked;
  out.treesChopped = typeof d.treesChopped === 'number' ? d.treesChopped : 0;
  out.eggsUnlocked = d.eggsUnlocked && typeof d.eggsUnlocked === 'object' ? d.eggsUnlocked : {};
  out.merchant = d.merchant || null;
  out.gachaPity = typeof d.gachaPity === 'number' ? d.gachaPity : 0;
  out.staminaShop = d.staminaShop && typeof d.staminaShop === 'object' ? d.staminaShop : {date:'', count:0};
  out.checkin = d.checkin && typeof d.checkin === 'object' ? d.checkin : {lastDate:'', streak:0, weekStart:''};
    if (d.weather && typeof d.weather === 'object'){
    const wType = WEATHERS[d.weather.type] ? d.weather.type : 'sunny';
    const wLast = (typeof d.weather.lastChange === 'number' && isFinite(d.weather.lastChange)) ? d.weather.lastChange : 0;
    out.weather = { lastChange: wLast, type: wType };
  } else {
    out.weather = { lastChange: 0, type: 'sunny' };
  }
  out.dailyEvent = d.dailyEvent && typeof d.dailyEvent === 'object' ? d.dailyEvent : {date:'', text:'', buff:''};
  out.totalStaminaBonus = typeof d.totalStaminaBonus === 'number' ? d.totalStaminaBonus : 0;
  out.levelSpeedBonus = typeof d.levelSpeedBonus === 'number' && isFinite(d.levelSpeedBonus) ? Math.max(0, d.levelSpeedBonus) : 0;
  out.levelMilestones = Array.isArray(d.levelMilestones) ? d.levelMilestones.filter(x => typeof x === 'number' && x > 0 && x % 5 === 0) : [];
  out.xpBonusCarry = typeof d.xpBonusCarry === 'number' && isFinite(d.xpBonusCarry) ? d.xpBonusCarry : 0;
  out.divinePick = !!d.divinePick; out.divineHoe = !!d.divineHoe; out.divineRod = !!d.divineRod;
  out.divineCrown = !!d.divineCrown; out.divineMeteorPick = !!d.divineMeteorPick;   out.divineSunRobe = !!d.divineSunRobe;
  if (!out.hasBowlEver && (out.inv.bowl || out.inv.bowl_rice)) out.hasBowlEver = true;
  if (out.codex.ore && out.codex.ore.stardust){
    out.codex.rare.stardust = true;
    delete out.codex.ore.stardust;
  }
  if (!Array.isArray(d.map) || d.map.length !== ROWS) out.map = null;
  else {
    let ok = true;
    const grid = d.map.map(row => { if (!Array.isArray(row) || row.length !== COLS){ ok = false; return null; } return row.map(cell => sanitizeCell(cell)); });
    out.map = ok ? grid : null;
  }
  return out;
}
function migrateSave(){
  if (localStorage.getItem(SAVE_KEY)) return null;
  for (const key of LEGACY_SAVE_KEYS){
    const raw = localStorage.getItem(key);
    if (!raw) continue;
    try { const d = JSON.parse(raw); const clean = sanitizeSaveData(d); if (!clean) continue; clean._version = SAVE_VERSION; clean._migratedFrom = key; localStorage.setItem(SAVE_KEY, JSON.stringify(clean)); return { from: key, version: d._version || '未知' }; } catch(e){ continue; }
  }
  return null;
}

      const o = {type:cell.type};
      if (cell.variant) o.variant = cell.variant; if (cell.hp) o.hp = cell.hp; if (cell.maxHp) o.maxHp = cell.maxHp;
      if (cell.crop) o.crop = cell.crop; if (cell.animal) o.animal = cell.animal; if (cell.feedCd) o.feedCd = cell.feedCd;
      if (cell.saplingStage) o.saplingStage = cell.saplingStage; if (cell.saplingCounter) o.saplingCounter = cell.saplingCounter;
      if (cell.saplingSpeed) o.saplingSpeed = cell.saplingSpeed; if (cell.originalType) o.originalType = cell.originalType;
      if (cell.love) o.love = cell.love; if (cell.loveFed) o.loveFed = cell.loveFed;
      if (cell.planted) o.planted = true;
      return o;
    })),
  };
}

function save(){
  if (_isResetting) return;
  if (!isFinite(state.coins)) state.coins = 0;
  if (!isFinite(state.xp)) state.xp = 0;
  if (!isFinite(state.level)) state.level = 0;
  if (!isFinite(state.stamina)) state.stamina = 0;
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(buildSaveData()));
  } catch(e) {}
}

const BACKUP_KEY = SAVE_KEY + '_backup';
let _lastBackupTs = 0;

function snapshotBackup(){
  // 只在"看起来是真实进度"时快照
  if (!state.playerName) return;
  if (state.level <= 1 && state.coins < 100 && Object.keys(state.inv).length < 3) return;
  // 距离上次快照至少 50 秒
  const now = Date.now();
  if (now - _lastBackupTs < 50000) return;
  try {
    localStorage.setItem(BACKUP_KEY, JSON.stringify(buildSaveData()));
    _lastBackupTs = now;
  } catch(e) {}
}

// 每 10 秒检查一次，够 50 秒就快照
setInterval(snapshotBackup, 10000);
function isSaveLooksReal(d){
  if (!d || typeof d !== 'object') return false;
  if (!d.playerName) return false;
  if (d.level <= 1 && d.coins < 100 && Object.keys(d.inv || {}).length < 3) return false;
  return true;
}

function load(){
  // 1. 先读主存档
  const raw = localStorage.getItem(SAVE_KEY);
  if (raw){
    try {
      const clean = sanitizeSaveData(JSON.parse(raw));
      if (clean && isSaveLooksReal(clean)){
        Object.assign(state, clean);
        return true;
      }
    } catch(e){}
  }
  // 2. 主存档不可用 → 尝试备份
  const bk = localStorage.getItem(BACKUP_KEY);
  if (bk){
    try {
      const clean = sanitizeSaveData(JSON.parse(bk));
      if (clean && isSaveLooksReal(clean)){
        Object.assign(state, clean);
        console.log('⚠️ 主存档损坏，已从备份恢复');
        return true;
      }
    } catch(e){}
  }
  return false;
}

window.addEventListener('beforeunload', save);

function strToB64(str){ const bytes = new TextEncoder().encode(str); let bin = ''; for (let i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]); return btoa(bin); }
function b64ToStr(b64){ const bin = atob(b64.replace(/\s+/g,'')); const bytes = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i); return new TextDecoder().decode(bytes); }
function exportSaveBase64(){ try { const raw = localStorage.getItem(SAVE_KEY); if (!raw) return ''; return strToB64(raw); } catch(e){ return ''; } }
function importSaveBase64(b64){
  try {
    const json = b64ToStr(b64.trim()); const d = JSON.parse(json); const clean = sanitizeSaveData(d);
    if (!clean) return { ok:false, msg:'存档格式不识别' };
    if (!clean.map) return { ok:false, msg:'地图数据异常（可能不完整）' };
    clean._version = SAVE_VERSION; clean._importedAt = Date.now();
    _isResetting = true; window.removeEventListener('beforeunload', save);
    localStorage.setItem(SAVE_KEY, JSON.stringify(clean));
    return { ok:true };
  } catch(e){ return { ok:false, msg: '解析失败：' + e.message }; }
}

function rollGacha(){
  state.gachaPity++;
  let forceHigh = false;
  if (state.gachaPity >= 100){ forceHigh = true; state.gachaPity = 0; }
  let item;
  if (forceHigh){
    const highPool = GACHA_POOL.filter(p => p.tier >= 5);
    const totalW = highPool.reduce((s,p)=>s+p.weight,0);
    let r = Math.random()*totalW;
    for (const p of highPool){ r -= p.weight; if (r <= 0){ item = p; break; } }
    if (!item) item = highPool[0];
  } else {
    const totalW = GACHA_POOL.reduce((s,p)=>s+p.weight,0);
    let r = Math.random()*totalW;
    for (const p of GACHA_POOL){ r -= p.weight; if (r <= 0){ item = p; break; } }
    if (!item) item = GACHA_POOL[0];
  }
  if (item.tier >= 5) state.gachaPity = 0;
  return item;
}
function applyGachaResult(item){
  if (item.give === '__stamina_up__'){ state.staminaMax += 10; state.totalStaminaBonus += 10; state.stamina = state.staminaMax; logEgg('🎰 ★★★★★★ 超级大奖：永久 +10 体力上限！'); }

}

  const already = c.lastDate === today;
  const nextDay = already ? currentStreak : currentStreak + 1;
  const rewards = [{coins:50, extra:'', icon:'💰'},{coins:80, extra:'', icon:'💰'},{coins:120, extra:'', icon:'💰'},{coins:200, extra:'', icon:'💰'},{coins:300, extra:'', icon:'💰'},{coins:500, extra:'', icon:'💰'},{coins:500, extra:'+ 传说鱼×1', icon:'🐉'}];
  const cells = rewards.map((r, i) => {
    const day = i+1;
    const done = day <= currentStreak;
    const isToday = !already && day === nextDay;
    const cls = 'checkin-cell' + (done?' done':'') + (isToday?' today':'');
    return `<div class="${cls}"><span class="cd">${done?'✅':r.icon}</span>D${day}<br>💰${r.coins}${r.extra?'<br>'+r.extra:''}</div>`;
  }).join('');
  openModal(`<h2>📅 每日签到<span>连续 ${currentStreak} 天</span></h2>
    <div style="color:var(--dim);font-size:12px">连续签到 7 天可以获得丰厚奖励。断签会重置进度。</div>
    <div class="checkin-grid">${cells}</div>
    <div class="modalFoot">${already ? '<span style="color:var(--dim);font-size:12px">今天已签到</span>' : `<button class="btn gold" id="btnDoCheckin">📅 签到（第 ${nextDay} 天）</button>`}<button class="btn" id="mClose">关闭</button></div>`,
    m => {
      m.querySelector('#mClose').onclick = closeModal;
      const btn = m.querySelector('#btnDoCheckin');
      if (btn) btn.onclick = () => { doCheckin(); openCheckin(); };
    });
}
function doCheckin(){
  const today = todayStr();
  const c = state.checkin;
  if (c.lastDate === today) return;
  const yesterday = new Date(); yesterday.setDate(yesterday.getDate()-1);
  const yStr = `${yesterday.getFullYear()}-${yesterday.getMonth()+1}-${yesterday.getDate()}`;
  if (c.lastDate !== yStr) c.streak = 0;
  c.streak++; c.lastDate = today;
  if (c.streak > 7) c.streak = 1;
  const rewards = [{coins:50, extra:null},{coins:80, extra:null},{coins:120, extra:null},{coins:200, extra:null},{coins:300, extra:null},{coins:500, extra:null},{coins:500, extra:'fish_legend'}];
  const r = rewards[c.streak - 1];
  state.coins += r.coins;
  if (r.extra) addItem(r.extra, 1);
  log(`📅 第 ${c.streak} 天签到：+${r.coins}💰${r.extra?' + 传说鱼×1':''}`);
  renderAll(); save();
}

function rollWeatherAndEvent(){
  const now = Date.now();
  const WEATHER_INTERVAL = 20 * 60 * 1000;   // 20 分钟
  if (!state.weather.lastChange || now - state.weather.lastChange >= WEATHER_INTERVAL){
    const roll = Math.random();
    let type = 'sunny';
    if (roll < 0.30) type = 'sunny'; else if (roll < 0.60) type = 'rain'; else if (roll < 0.80) type = 'thunder'; else type = 'snow';
    state.weather = { lastChange: now, type };
    if (type === 'thunder') triggerThunderMutation();
    const w = WEATHERS[type];
    logEvent(`${w.icon} 天气变化：${w.name}`);
    if (type === 'rain') logEvent('   🌧️ 雨天会自动给作物浇水，省去繁琐的过程。');
    if (type === 'thunder') logEvent('   ⛈️ 雷雨可能让作物发生变异……');
    if (type === 'snow') logEvent('   ❄️ 雪天作物会暂停生长，但树林挂着雪景。');
    if (typeof renderTop === 'function') renderTop();
  }
  const today = todayStr();
  if (state.dailyEvent.date !== today){
    const ev = DAILY_EVENTS[Math.floor(Math.random()*DAILY_EVENTS.length)];
    state.dailyEvent = {date: today, text: ev.text, buff: ev.buff || ''};
    logEvent(ev.text);
    if (ev.give) for (const [id,n] of Object.entries(ev.give)) addItem(id, n);
  }
}

function doFillBucket(r,c){
  if (!removeItem('iron_bucket', 1)) return;
  addItem('water_bucket', 1);
  state.map[r][c] = makeCell('empty'); updateCell(r,c);
  setTimeout(() => { if (state.map[r][c] && state.map[r][c].type === 'empty'){ state.map[r][c] = makeCell('water'); updateCell(r,c); } }, 5000);
  if (hasItem('water_bucket')) state.selected = 'water_bucket'; else state.selected = null;
  gainXp(1); log('🛢️ 装了一桶水（水会在 5 秒后原地重生）'); renderInventory();
}
function doWaterCrop(r,c){
  const d = state.map[r][c];
  if (!d.crop){ log('💧 这里没有作物需要浇水'); return; }
  if (d.crop.watered){ log('💧 这株作物已经浇过水了'); return; }
  if (!removeItem('water_bucket', 1)) return;
  addItem('iron_bucket', 1); d.crop.watered = true; updateCell(r,c);
  if (hasItem('iron_bucket')) state.selected = 'iron_bucket'; else state.selected = null;
  gainXp(1); 
  const cropName = d.crop.lucky ? '神秘种子' : CROPS[d.crop.id].name;
  log(`💧 浇水成功！${cropName} 开始生长`); 
  renderInventory();
  if (!state._hasWateredCrop) {
    state._hasWateredCrop = true;
    log('💡 提示：作物成熟需要时间。趁现在，去河边点水面钓几条鱼吧！');
  }
}

function onCellClick(r,c){
  const now = Date.now();
  if (r === lastClick.r && c === lastClick.c && now - lastClick.t < 200) return;
  lastClick = {r, c, t: now};
  const d = state.map[r][c];

  if (d.type === 'water' && state.selected === 'iron_bucket'){ doFillBucket(r,c); return; }
  if ((d.type === 'dirt' || d.type === 'farmland') && state.selected === 'water_bucket'){
    if (d.crop && !d.crop.watered){ doWaterCrop(r,c); return; }
  }
  if ((d.type === 'empty' || d.type === 'dirt' || d.type === 'farmland') && state.selected === 'maple_sapling'){
    tryPlantSapling(r,c); return;
  }
  if ((d.type === 'empty' || d.type === 'grass' || d.type === 'dirt' || d.type === 'farmland') && state.selected && state.selected.startsWith('flower_')){
    tryPlantFlower(r,c); return;
  }

  if (HARVEST_TYPES.has(d.type)){
    if (now - lastHarvest < HARVEST_CD){ log(`⏳ 冷却中… 还需 ${((HARVEST_CD-(now-lastHarvest))/1000).toFixed(1)} 秒`); return; }
    if (!hasStamina()){ log('⚡ 体力不足（需要 2 点）！吃点东西吧'); return; }
    let ok = false;
    switch (d.type){
      case 'grass': ok = doHarvestGrass(r,c); break;
      case 'flower': ok = doPickFlower(r,c); break;
      case 'tree': ok = doChopTree(r,c); break;
      case 'rock': ok = doMine(r,c); break;
      case 'dirt': case 'farmland': ok = doDirtOrFarmland(r,c); break;
      case 'sand': ok = doDigSand(r,c); break;
      case 'clay': ok = doDigClay(r,c); break;
      case 'sapling': log(`🌱 树苗生长中… (${d.saplingStage}/2)`); ok = false; break;
      case 'animal': ok = doAnimal(r,c); break;
    }
    if (ok){ lastHarvest = now; spendStamina(); }
    return;
  }

  switch (d.type){
    case 'water': openFishing(); break;
    case 'workbench': openCraft(); break;
    case 'artisan': openArtisan(); break;
    case 'chest': openChest(); break;
    case 'shop': openShop(); break;
    case 'furnace': openFurnace(); break;
    case 'gacha': openGacha(); break;
    case 'wish_well': openWishWell(); break;
    case 'merchant': openMerchant(); break;
    case 'enchant_low': if (state.enchLowUnlocked) openEnchant('low'); else openEnchantUnlock('low'); break;
    case 'enchant_high': if (state.enchHighUnlocked) openEnchant('high'); else openEnchantUnlock('high'); break;
  }
}

function tryPlantSapling(r,c){
  if (!hasStamina()){ log('⚡ 体力不足（需要 2 点）！吃点东西吧'); return; } // 新增判定
  const d = state.map[r][c];
  if (d.type !== 'empty' && d.type !== 'dirt' && d.type !== 'farmland'){ log('🌱 只能种在泥土、耕地或空地上'); return; }
  if (d.crop){ log('🌱 这里已经有作物了'); return; }
  
  for (let dr=-1;dr<=1;dr++) for (let dc=-1;dc<=1;dc++){
    const nr=r+dr, nc=c+dc;
    if (nr<0||nr>=ROWS||nc<0||nc>=COLS){ log('🌱 需要 3×3 的空间，不能超出地图边界'); return; }
    const nd = state.map[nr][nc];
    if (nd.type !== 'empty' && nd.type !== 'dirt' && nd.type !== 'farmland'){ 
      log(`🌱 3×3 范围内有障碍物 (${nr},${nc})`); return; 
    }
    if (nd.crop){ log(`🌱 3×3 范围内有作物 (${nr},${nc})`); return; }
    if (nd.animal){ log(`🌱 3×3 范围内有动物 (${nr},${nc})`); return; }
  }
  if (!removeItem('maple_sapling',1)) return;
  const centerType = state.map[r][c].type;
  state.map[r][c] = makeCell('sapling', {saplingStage: 0, saplingCounter: 0, saplingSpeed: centerType === 'farmland' ? 'fast' : 'normal', originalType: centerType, planted: true});
  updateCell(r,c);
  if (!hasItem('maple_sapling')) state.selected = null;
  gainXp(3); spendStamina(); // 扣除体力
  log('🌱 种下枫树苗，需要 3×3 空间生长'); renderInventory();
}

function harvestOneCrop(r,c){
  const d = state.map[r][c];
  if (!d.crop || d.crop.stage < CROPS[d.crop.id].grow) return false;
  const cd = CROPS[d.crop.id];
  let n = randInt(cd.yield[0], cd.yield[1]);
  if (state.divineHoe) n = Math.ceil(n * 1.5);
  if (state.divineHoe && Math.random() < 0.15) n += 1;
  let isGold = false;
  const isMutant = !!d.crop.mutant;
  if (isMutant){
    addItem(cd.mutantId, n); unlockCodex('crop', cd.mutantId);
    logEgg(`⛈️✨ 收获了【${def(cd.mutantId).name}】×${n}！（3 倍售价）`);
  } else if (d.crop.lucky){
    isGold = true;
    const luckyCrops = ['wheat','rice','watermelon'];
    const luckyId = luckyCrops[Math.floor(Math.random()*luckyCrops.length)];
    const luckyCd = CROPS[luckyId];
    n = randInt(luckyCd.yield[0], luckyCd.yield[1]);
    if (luckyId === 'watermelon'){ addItem('watermelon_gold', n); unlockCodex('crop','watermelon_gold'); }
    else { addItem(luckyCd.goldId, n); unlockCodex('crop', luckyCd.goldId); }
    logEgg(`🍀✨ 神秘种子生效！收获了【金穗${luckyCd.name}】×${n}！`);
  }else if (Math.random() < 0.02){
    isGold = true;
    addItem(cd.goldId, n); unlockCodex('crop', cd.goldId);
    logEgg(`✨ 幸运！你收获了【金穗${cd.name}】×${n}！`);
  } else if (d.crop.id === 'watermelon'){
    if (Math.random() < 0.0005){
      addItem('iron_watermelon', 1);
      unlockCodex('rare', 'iron_watermelon');
      logEgg('🌑✨✨ 你长出了传说中的【铁西瓜】！！！');
    } else {
      addItem('watermelon_slice', n);
    }
  } else {
    addItem(d.crop.id, n);
  }
  gainXp(6); unlockCodex('crop', d.crop.id); progressTask('harvest');
  if (!isGold && !isMutant) log(`🌾 收获 ${cd.name} ×${n}`);
  // 普通收获 20% 概率额外掉对应种子（金穗/变异不掉）
  if (!isGold && !isMutant && Math.random() < 0.20){
    addItem('seed_' + d.crop.id, 1);
    log(`🌱 额外收获了 ${cd.name}种子 ×1`);
  }

  d.crop = null; updateCell(r,c);
  return true;
}


function doDirtOrFarmland(r,c){
  const d = state.map[r][c];

  // ★ 收获成熟作物（镰刀 3×3 范围）
  if (d.crop && d.crop.stage >= CROPS[d.crop.id].grow){
    const targets = [[r,c]];
    if (state.hasSickle){
      for (let dr=-1;dr<=1;dr++) for (let dc=-1;dc<=1;dc++){
        if (dr===0 && dc===0) continue;
        const nr=r+dr, nc=c+dc;
        if (nr<0||nr>=ROWS||nc<0||nc>=COLS) continue;
        const nd = state.map[nr][nc];
        if ((nd.type === 'dirt' || nd.type === 'farmland') && nd.crop && nd.crop.stage >= CROPS[nd.crop.id].grow){
          targets.push([nr,nc]);
        }
      }
    }
    let count = 0;
    for (const [nr,nc] of targets) if (harvestOneCrop(nr,nc)) count++;
    if (count > 1) log(`🌾 镰刀 3×3 一次收获 ${count} 株作物！`);
    return true;
  }

  if (d.crop){ log(`🌱 还在生长中… (${d.crop.stage}/${CROPS[d.crop.id].grow})`); return false; }
  if (state.selected && def(state.selected).seed){
    if (isNearPlayerMaple(r, c)) { log('🌱 枫树周围 3×3 范围内不能种作物'); return false; }
    const cropId = def(state.selected).seed;
    const wasLucky = !!def(state.selected).lucky;
    if (!removeItem(state.selected, 1)){ state.selected = null; renderInventory(); return false; }
    d.crop = {id:cropId, stage:0, counter:0, watered:false, lucky: wasLucky};
    if (!hasItem(state.selected)) state.selected = null;
    gainXp(2);
    const cropName = wasLucky ? '神秘种子' : CROPS[cropId].name;
    if (state.weather.type === 'rain' || state.weather.type === 'thunder'){
      d.crop.watered = true;
      log(`🌱 种下 ${cropName}，🌧️ 雨天自动浇水`);
    } else {
      const speedTag = d.type === 'farmland' ? '（耕地加速 30%）' : '';
      log(`🌱 种下了 ${cropName}${speedTag} · 💧 需要浇一次水才会生长`);
    }
    updateCell(r,c); renderInventory(); return true;
  }
  if (d.type === 'dirt'){
    if (!state.hasSickle){ log('🌾 需要镰刀才能开垦（也可以选中种子直接种植）'); return false; }
    state.map[r][c] = makeCell('farmland'); updateCell(r,c); gainXp(2);
    log('🌾 开垦出一块耕地！作物在此成熟快 30%'); return true;
  }
  log('🌱 先在背包里选中一包种子'); return false;
}

function doDigSand(r,c){ addItem('sand', 1); gainXp(1); progressTask('mine','sand'); log('🟨 挖到沙子 ×1'); state.map[r][c] = makeCell('empty'); updateCell(r,c); return true; }
function doDigClay(r,c){ addItem('clay', 1); gainXp(1); log('🟫 挖到粘土 ×1'); state.map[r][c] = makeCell('water'); updateCell(r,c); return true; }

function doHarvestGrass(r,c){
  const targets = [[r,c]];
  if (state.hasSickle) for (let dr=-1;dr<=1;dr++) for (let dc=-1;dc<=1;dc++){
    if (dr===0 && dc===0) continue;
    const nr=r+dr, nc=c+dc;
    if (nr<0||nr>=ROWS||nc<0||nc>=COLS) continue;
    if (state.map[nr][nc].type === 'grass') targets.push([nr,nc]);
  }
  let count = 0;
  const cropPool = Object.entries(CROPS).filter(([k,v])=>v.type==='crop').map(([k,v])=>[k,v.seedW]);
  for (const [nr,nc] of targets){
    addItem('fiber', 1);
    if (Math.random() < 0.40){ const cropId = weightedPick(cropPool); addItem('seed_'+cropId, 1); log(`🌱 割草时发现了 ${CROPS[cropId].name}种子`); }
    if (Math.random() < 0.06) addItem('seed_wheat', 1);
    if (Math.random() < 0.04) addItem('maple_sapling', 1);
    const restore = inFarmArea(nr, nc) ? 'dirt' : 'empty';
    state.map[nr][nc] = makeCell(restore); updateCell(nr,nc);
    if (restore === 'empty') scheduleSpawn('grass', 14000);
    count++;
  }
  gainXp(count); log(`🌿 收获了 ${count} 个纤维${count>1?'（镰刀 3×3）':''}`); return true;
}

function tryPlantFlower(r,c){
  if (!hasStamina()){ log('⚡ 体力不足（需要 2 点）！吃点东西吧'); return; } // 新增判定
  if (!inFarmArea(r,c)){ log('🌸 只能在农田区（地图左下方）种花'); return; }
  if (isNearPlayerMaple(r, c)){ log('🌸 农田枫树周围 3×3 范围内不能种花'); return; }
  if (state.map[r][c].crop){ log('🌸 这里已经有作物了，先收获或移除它'); return; }
  const d = state.map[r][c];
  if (d.type !== 'empty' && d.type !== 'grass' && d.type !== 'dirt' && d.type !== 'farmland'){
    log('🌸 只能种在泥土、耕地、空地或草地上'); return;
  }
  const id = state.selected;
  const variant = id.replace('flower_','');
  if (!PLANTABLE_FLOWERS.has(variant)){ log('🌸 这种植物无法种植'); return; }
  let cnt = 0;
  for (let rr=FARM_R0;rr<=FARM_R1;rr++) for (let cc=FARM_C0;cc<=FARM_C1;cc++){
    const dd = state.map[rr][cc];
    if (dd.type === 'flower' && dd.variant === variant) cnt++;
  }
  if (cnt >= FLOWER_LIMIT_FARM){ log(`🌸 农田区内 ${FLOWERS[variant].name} 已达上限（${FLOWER_LIMIT_FARM} 朵）`); return; }
  if (!removeItem(id,1)){ state.selected = null; renderInventory(); return; }
  const originalType = (d.type === 'dirt' || d.type === 'farmland') ? d.type : null;
  state.map[r][c] = makeCell('flower', {variant, planted: true, originalType});
  updateCell(r,c);
  gainXp(2); spendStamina(); // 扣除体力
  log(`🌸 在农田区种下 ${FLOWERS[variant].name}（会向周围慢慢蔓延）`);
  if (!hasItem(id)) state.selected = null;
  renderInventory();
}

function spreadAllFlowers(){
  const farmCounts = {}, list = [];
  for (let r=FARM_R0;r<=FARM_R1;r++) for (let c=FARM_C0;c<=FARM_C1;c++){
    const d = state.map[r][c];
    if (d.type === 'flower' && d.variant){
      farmCounts[d.variant] = (farmCounts[d.variant]||0) + 1;
      if (d.planted && PLANTABLE_FLOWERS.has(d.variant)) list.push([r,c,d.variant]);
    }
  }
  list.sort(()=>Math.random()-0.5);
  for (const [r,c,variant] of list){
    if ((farmCounts[variant]||0) >= FLOWER_LIMIT_FARM) continue;
    if (Math.random() >= 0.08) continue;
    const cands = [];
    for (let dr=-1;dr<=1;dr++) for (let dc=-1;dc<=1;dc++){
      if (dr===0 && dc===0) continue;
      const nr=r+dr, nc=c+dc;
      if (nr<0||nr>=ROWS||nc<0||nc>=COLS) continue;
      if (!inFarmArea(nr,nc)) continue;
      if (isNearPlayerMaple(nr, nc)) continue;
      const cell = state.map[nr][nc];
      if (cell.crop) continue;   // ← 关键：有作物就不扩散过去
      if (cell.type === 'empty' || cell.type === 'grass' || cell.type === 'dirt' || cell.type === 'farmland') cands.push([nr,nc]);
    }
    if (!cands.length) continue;
    const [nr,nc] = cands[Math.floor(Math.random()*cands.length)];
    const origT = state.map[nr][nc].type;
    const origType = (origT === 'dirt' || origT === 'farmland') ? origT : null;
    state.map[nr][nc] = makeCell('flower', {variant, planted: true, originalType: origType});
    updateCell(nr,nc);
    farmCounts[variant] = (farmCounts[variant]||0) + 1;
  }
}

function scheduleFlowerRespawn(){
  const flowerPairs = Object.entries(FLOWERS).map(([k,v])=>['flower_'+k, v.weight]);
  setTimeout(() => {
    const variant = weightedPick(flowerPairs).replace('flower_','');
    let wildCnt = 0;
    for (let rr=0;rr<ROWS;rr++) for (let cc=0;cc<COLS;cc++){
      if (inFarmArea(rr,cc)) continue;
      const d = state.map[rr][cc];
      if (d && d.type === 'flower' && d.variant === variant) wildCnt++;
    }
    if (wildCnt >= FLOWER_LIMIT_WILD) return;
    const empties = [];
    for (let rr=0;rr<ROWS;rr++) for (let cc=0;cc<COLS;cc++)
      if (state.map[rr][cc] && state.map[rr][cc].type === 'empty' && !inFarmArea(rr,cc) && !isNearPlayerMaple(rr,cc)) empties.push([rr,cc]);
    if (!empties.length) return;
    const [rr,cc] = empties[Math.floor(Math.random()*empties.length)];
    state.map[rr][cc] = makeCell('flower', {variant});
    updateCell(rr,cc);
  }, 22000);
}


function doPickFlower(r,c){
  const useSickle = state.hasSickle && inFarmArea(r, c);
  const targets = [[r,c]];
  if (useSickle){
    for (let dr=-1;dr<=1;dr++) for (let dc=-1;dc<=1;dc++){
      if (dr===0 && dc===0) continue;
      const nr=r+dr, nc=c+dc;
      if (nr<0||nr>=ROWS||nc<0||nc>=COLS) continue;
      if (!inFarmArea(nr, nc)) continue;   // ← 关键：范围外跳过
      if (state.map[nr][nc].type === 'flower') targets.push([nr,nc]);
    }
  }
  const collected = {};
  let total = 0;
  for (const [nr,nc] of targets){
    const d = state.map[nr][nc];
    const color = d.variant;
    const f = FLOWERS[color];
    if (!f) continue;
    let n = 1;
    if (state.dailyEvent.buff === 'flower_bonus') n = 2;
    addItem('flower_'+color, n);
    collected[color] = (collected[color]||0) + n;
    gainXp(2); unlockCodex('flower', 'flower_'+color); progressTask('pick_flower');
    const restore = (d.originalType === 'dirt' || d.originalType === 'farmland') ? d.originalType
                  : (inFarmArea(nr, nc) ? 'dirt' : 'empty');
    state.map[nr][nc] = makeCell(restore); updateCell(nr,nc);
    total++;
    scheduleFlowerRespawn();
  }
  if (total === 0) return false;
  if (total === 1){
    const [id,n] = Object.entries(collected)[0];
    log(`🌸 采到 ${FLOWERS[id.replace('flower_','')].name} ×${n}`);
  } else {
    const summary = Object.entries(collected).map(([id,n]) => `${FLOWERS[id.replace('flower_','')].name}×${n}`).join('、');
    log(`🌾 镰刀在田里一次采到 ${total} 朵：${summary}`);
  }
  return true;
}

function doChopTree(r,c){
  if (!state.axe){ log('🪓 你需要先在商店购买斧头'); return false; }
  const d = state.map[r][c];
  const ench = getAxeEnch();
  const dmg = AXES[state.axe].dmg + ench.eff;
  d.hp -= dmg;
  if (d.hp <= 0){
    let logN = randInt(3, 6);
    if (ench.for > 0) logN += Math.floor(logN * ench.for * 0.15);
    const appleN = randInt(0,3);
    addItem('maple_log', logN);
    if (appleN > 0) addItem('apple', appleN);
    if (Math.random() < 0.25) addItem('maple_sapling', 1);
        gainXp(4); progressTask('chop'); state.treesChopped++;
    unlockCodex('crop', 'maple');
    let msg = `🌲 砍倒枫树，获得枫木原木 ×${logN}`;
    if (appleN > 0) msg += `、苹果 ×${appleN}`;
    log(msg);
    checkForestKing();
    if (!state._hasChoppedTree) {
      state._hasChoppedTree = true;
      log('💡 小提示：去 🛠️ 工作台把原木做成木板（1原木=4木板），然后再去杂货铺卖掉，利润极高！');
    }
    let restoreType = d.originalType;
    if (!restoreType){ const inFarm = (r >= 7 && r <= 15 && c >= 3 && c <= 11); restoreType = inFarm ? 'dirt' : 'empty'; }
    state.map[r][c] = makeCell(restoreType); updateCell(r,c);
    if (restoreType === 'empty') scheduleSpawn('tree', 30000, {hp:16, maxHp:16});
  } else {
    log(`🪓 砍击中… (${Math.max(0,d.hp)}/${d.maxHp})`); updateCell(r,c);
  }
  return true;
}

function doMine(r,c){
  const d = state.map[r][c];
  const ore = ORES[d.variant];
  if (state.pickaxe < ore.req){
    log(`⛏️ 你的${PICKAXES[state.pickaxe].name}不够硬，需要${PICKAXES[ore.req].name}`);
    return false;
  }
  const ench = getPickEnch();
  const dmg = PICKAXES[state.pickaxe].dmg + ench.eff;
  d.hp -= dmg;
  gainXp(1);
  if (d.hp <= 0){
    let n = randInt(ore.amt[0], ore.amt[1]);
    if (ench.for > 0) n += Math.floor(n * ench.for * 0.15);
    if (state.divinePick) n = Math.ceil(n * 2);
    if (state.divinePick && Math.random() < 0.40) n += 1;
    addItem(ore.drop, n);
    gainXp(ore.xp);
    unlockCodex('ore', d.variant);
    progressTask('mine', d.variant);
    log(`⛏️ 挖到 ${ore.name} ×${n}`);
    if (state.divineMeteorPick && Math.random() < 0.03){
      handleStardustDrop('🌟 陨星镐触发！挖到了【星尘】！');
    }
    tryDropStardust();
        state.map[r][c] = makeCell('empty');
    updateCell(r,c);
    
    // 每次重生时，按照新的 ORE_WEIGHTS 重新随机抽取一个矿种！
    setTimeout(() => {
      const empties = [];
      for (let rr=0;rr<ROWS;rr++) for (let cc=0;cc<COLS;cc++){
        if (state.map[rr][cc] && state.map[rr][cc].type === 'empty' && !isNearPlayerMaple(rr,cc)) empties.push([rr,cc]);
      }
      if (!empties.length) return;
      const [rr,cc] = empties[Math.floor(Math.random()*empties.length)];
      const newOre = weightedPick(ORE_WEIGHTS); // 重新抽奖
      state.map[rr][cc] = makeCell('rock', {variant:newOre, hp:ORES[newOre].hp, maxHp:ORES[newOre].hp});
      updateCell(rr,cc);
    }, ore.respawn * 1000);
  } else {
    log(`⛏️ 敲击中… (${Math.max(0,d.hp)}/${d.maxHp})`);
    updateCell(r,c);
  }
  return true;
}

function doAnimal(r,c){
  const d = state.map[r][c];
  const a = d.animal;
  const now = Date.now();
  if (d.feedCd && now < d.feedCd){ const remain = ((d.feedCd - now) / 1000).toFixed(1); log(`⏳ 这只动物正在消化… 还需 ${remain} 秒`); return false; }
  let success = false;
  let producedRare = false;
  const today = todayStr();
  const hasLoveFed = d.loveFed === today;
  if (a === 'chicken'){
    if (hasItem('seed_wheat',1) || hasItem('seed_rice',1)){
      if (hasItem('seed_wheat',1)) removeItem('seed_wheat',1); else removeItem('seed_rice',1);
      if (d.love >= 4 && !hasLoveFed){
        addItem('golden_egg', 1); unlockCodex('rare', 'golden_egg'); gainXp(5);
        logEgg('🥚✨ 好感度满！小鸡产出了【金蛋】！好感度清零，重新开始培养');
        producedRare = true;
      }
      else { addItem('egg',1); gainXp(3); log('🥚 小鸡下了一个蛋！'); }
      progressTask('feed'); success = true;
    } else log('🐔 需要小麦或米种子来喂鸡');
  } else if (a === 'cow'){
    if (hasItem('wheat',1)){
      removeItem('wheat',1);
      if (d.love >= 4 && !hasLoveFed){
        addItem('milk', 3); gainXp(5);
        logEgg('🥛✨ 好感度满！牛产出了 3 份牛奶！好感度清零，重新开始培养');
        producedRare = true;
      }
      else { addItem('milk',1); gainXp(3); log('🥛 牛产出了牛奶！'); }
      progressTask('feed'); success = true;
    } else log('🐄 需要小麦来喂牛');
  } else if (a === 'sheep'){
    if (hasItem('wheat',1)){
      removeItem('wheat',1);
      if (d.love >= 4 && !hasLoveFed){
        addItem('rainbow_wool', 1); unlockCodex('rare', 'rainbow_wool'); gainXp(5);
        logEgg('☁️✨ 好感度满！羊产出了【彩虹羊毛】！好感度清零，重新开始培养');
        producedRare = true;
      }
      else { addItem('wool',2); gainXp(3); log('☁️ 羊产出了羊毛 ×2！'); }
      progressTask('feed'); success = true;
    } else log('🐑 需要小麦来喂羊');
  }
  if (success){
    d.feedCd = now + 20000;
    if (producedRare){
      d.love = 0;
      d.loveFed = today;
    } else if (d.loveFed !== today){
      d.love = Math.min(5, (d.love||0) + 1);
      d.loveFed = today;
    }
    renderAll(); updateCell(r,c); return true;
  }
  return false;
}

function onInvClick(id){
  const it = def(id);
  // 能选中的物品（种子 / 树苗 / 桶）优先——不管它能不能卖
  const canPlantFlower = id.startsWith('flower_') && PLANTABLE_FLOWERS.has(id.replace('flower_',''));
  const selectable = it.seed || id === 'maple_sapling' || id === 'iron_bucket' || id === 'water_bucket' || canPlantFlower;
  if (selectable){
    state.selected = (state.selected === id) ? null : id;
    renderInventory();
    if (state.selected) log(`👉 已选中 ${it.name}`);
    return;
  }
  // 不能卖的东西，点一下提示
  if (it.noSell){ log(`❌ ${it.name} 是永久工具，不能出售`); return; }
  // 其他物品：点一下卖 1 个
  if (state.selected === id){ state.selected = null; renderInventory(); return; }
  // ★ 上锁检查
  if (state.locked[id]){
    log(`🔒 ${it.name} 已上锁，先点右上角的锁图标解锁才能出售`);
    return;
  }
  sellOne(id);
}

function openArtisan(){

  }

      m.querySelector('#mClose').onclick = closeModal;

        el.onclick = () => {
          if (el.classList.contains('dis')){ log('❌ 材料不足'); return; }
          const type = el.dataset.type;
          if (type === 'dye'){
            const r = DYE_RECIPES.find(x=>x.color===el.dataset.color);

function isRecipeOwned(r){
  if (!r.uniqueKey) return false;
  const keys = Array.isArray(r.uniqueKey) ? r.uniqueKey : [r.uniqueKey];
  return keys.some(id => hasItem(id, 1));
}
function costText(cost, needBowl){
  let s = Object.entries(cost).map(([id,n]) => {
    const ok = hasItem(id,n);
    return `<span style="color:${ok?'var(--green)':'var(--red)'}">${def(id).icon}${def(id).name}×${n}</span>`;
  }).join(' ');
  if (needBowl){ const ok = hasItem('bowl',1); s += ` 🔧<span style="color:${ok?'var(--green)':'var(--red)'}">碗（不消耗）</span>`; }
  return s;
}

function openCraft(){
  const items = RECIPES.map(r => {
    let can = Object.entries(r.cost).every(([id,n]) => hasItem(id,n));
    const owned = isRecipeOwned(r);
    if (owned) can = false;
    if (r.needBowl && !hasItem('bowl', 1)) can = false;
    let sub = costText(r.cost, r.needBowl);
    if (owned) sub = '<span style="color:var(--gold)">已拥有</span>';
    return `<div class="craftItem ${can?'':'dis'}" data-rid="${r.id}"><div class="ci">${r.icon}</div><div class="cn"><b>${r.name}</b><small>${sub}</small></div></div>`;
  }).join('');
  openModal(`<h2>🛠️ 工作台<span>基础合成</span></h2><div class="craftList">${items}</div><div class="modalFoot"><button class="btn" id="mClose">关闭</button></div>`,
    m => {
      m.querySelector('#mClose').onclick = closeModal;
      m.querySelectorAll('.craftItem[data-rid]').forEach(el => {
        el.onclick = () => {
          const r = RECIPES.find(x => x.id === el.dataset.rid);
          if (!r) return;
          if (isRecipeOwned(r)){ log(`❌ 你已经有${r.name}了，无法重复合成`); return; }
          if (r.needBowl && !hasItem('bowl', 1)){ log('❌ 需要先在背包里准备一个碗'); return; }
          if (!Object.entries(r.cost).every(([id,n]) => hasItem(id,n))){ log('❌ 材料不足'); return; }
          Object.entries(r.cost).forEach(([id,n]) => removeItem(id,n));
          if (r.uniqueKey === 'bowl') state.hasBowlEver = true;
          Object.entries(r.out).forEach(([id,n]) => addItem(id,n));
          gainXp(5); progressTask('craft');
          if (r.id === 'r_bowl_rice') unlockCodex('crop', 'bowl_rice');
          if (r.id === 'r_stardust') unlockCodex('rare', 'stardust');
          if (r.id === 'r_bread') unlockCodex('crop', 'bread');
          if (r.id === 'r_bread_gold') unlockCodex('crop', 'bread_gold');
          if (r.id === 'r_bread_mutant') unlockCodex('crop', 'bread_mutant');
          if (r.id === 'r_bowl_rice_gold') unlockCodex('crop', 'bowl_rice_gold');
          if (r.id === 'r_bowl_rice_mutant') unlockCodex('crop', 'bowl_rice_mutant');
          log(`🛠️ 合成了 ${r.name}`);
          openCraft();
        };
      });
    });
}

  for (const [k,v] of Object.entries(CROPS)){
    const price = v.seedPrice;
    rows.push(`<div class="craftItem" data-act="seed" data-seed="${k}"><div class="ci">🌱</div><div class="cn"><b>${v.name}种子</b><small>💰 ${price}</small></div></div>`);
  }
  if (staminaPrice !== null){ const can = state.coins >= staminaPrice; rows.push(`<div class="craftItem ${can?'':'dis'}" data-act="stam"><div class="ci">⚡</div><div class="cn"><b>购买体力 +20</b><small>💰 ${staminaPrice} · 今日 ${staminaCount}/5</small></div></div>`); }
  else rows.push(`<div class="craftItem dis"><div class="ci">⚡</div><div class="cn"><b>体力已售完</b><small>今天买满了 5 次</small></div></div>`);
  openModal(`<h2>🏪 杂货铺<span>金币：${state.coins}</span></h2><div class="craftList">${rows.join('')}</div><div class="modalFoot"><button class="btn gold" id="mSellAll">💰 一键出售</button><button class="btn" id="mClose">关闭</button></div>`,
    m => {
      m.querySelector('#mClose').onclick = closeModal;
      m.querySelector('#mSellAll').onclick = () => {
        let total = 0, kinds = 0;
        const TOOL_IDS = new Set(['iron_bucket', 'water_bucket', 'bowl']);
        for (const id of Object.keys(state.inv)){
          if (state.locked[id]) continue;
          if (TOOL_IDS.has(id)) continue;
          const it = def(id);
          if (it.sell >= 1){
            let price = it.sell;
            const proBonus = getProBonus(id);
            if (proBonus > 0) price = Math.floor(price * (1 + proBonus));
            if (state.dailyEvent.buff === 'sell_bonus') price = Math.floor(price * 1.2);
            if (state.divineSunRobe) price = Math.floor(price * 1.5);
            total += price * state.inv[id]; kinds++;
            delete state.inv[id];
          }
        }
        if (total === 0){ log('💤 没有可出售的东西'); return; }
        state.coins += total; progressTask('sell');
        log(`💰 出售了 ${kinds} 种物品，共获得 ${total} 金币`);
        renderAll(); openShop();
      };
      m.querySelectorAll('.craftItem[data-act]').forEach(el => {
        el.onclick = () => {
          const act = el.dataset.act;
          if (act === 'pick'){
            const p = PICKAXES[state.pickaxe + 1];
            if (state.coins < p.cost){ log('❌ 金币不足'); return; }
            state.coins -= p.cost;
            const oldIdx = state.pickaxe;
            state.pickaxe++;
            const oldE = state.tools['t'+oldIdx];
            state.tools['t'+state.pickaxe] = {eff: Math.max(0, oldE.eff-1), for: Math.max(0, oldE.for-1), pro: Math.max(0, oldE.pro-1)};
            log(`⛏️ 升级为 ${p.name}！附魔已 -1`);
          } else if (act === 'axe'){
            const a = AXES[state.axe + 1];
            if (state.coins < a.cost){ log('❌ 金币不足'); return; }
            state.coins -= a.cost;
            const oldIdx = state.axe;
            state.axe++;
            if (oldIdx > 0){ const oldE = state.tools['a'+oldIdx]; state.tools['a'+state.axe] = {eff: Math.max(0, oldE.eff-1), for: Math.max(0, oldE.for-1), pro: Math.max(0, oldE.pro-1)}; }
            log(`🪓 升级为 ${a.name}！`);
          } else if (act === 'rod'){
            const r = RODS[state.rod + 1];
            if (state.coins < r.cost){ log('❌ 金币不足'); return; }
            state.coins -= r.cost;
            const oldIdx = state.rod;
            state.rod++;
            if (oldIdx > 0){ const oldE = state.tools['r'+oldIdx]; state.tools['r'+state.rod] = {eff: Math.max(0, oldE.eff-1), for: Math.max(0, oldE.for-1), pro: Math.max(0, oldE.pro-1)}; }
            log(`🎣 升级为 ${r.name}！`);
          } else if (act === 'sickle'){
            if (state.coins < 80){ log('❌ 金币不足'); return; }
            state.coins -= 80; state.hasSickle = true;
            log('🌾 购买了镰刀');
          } else if (act === 'seed'){
            const k = el.dataset.seed;
            const price = CROPS[k].seedPrice;
            if (state.coins < price){ log('❌ 金币不足'); return; }
            state.coins -= price; addItem('seed_'+k, 1);
            log(`🛒 购买了 ${CROPS[k].name}种子`);
          } else if (act === 'stam'){
            if (state.coins < staminaPrice){ log('❌ 金币不足'); return; }
            state.coins -= staminaPrice;
            state.staminaShop.count++;
            state.stamina = Math.min(state.staminaMax, state.stamina + 20);
            log(`⚡ 购买体力 +20（-${staminaPrice}💰）`);
          }
          renderAll(); openShop();
        };
      });
    });
}

const ENCH_KEYS = ['eff', 'for', 'pro'];
const ENCH_NAMES = {eff:'效率', for:'时运', pro:'丰饶'};
const ENCH_DESC = {eff: {pick:'挖矿伤害 +1', axe:'砍树伤害 +1', rod:'钓鱼窗口 +0.1秒'}, for: {pick:'矿石掉落 +15%', axe:'木材/苹果 +15%', rod:'传说鱼率 +2%'}, pro: {pick:'矿石卖价 +10%', axe:'木材/苹果卖价 +10%', rod:'鱼类卖价 +10%'}};

const DIVINE_ITEMS = [
  {id:'divineRod', name:'海神竿', icon:'🎣', desc:'空钩率减半 + 传说鱼率额外 +5%', cost:{ fish_legend:3, gold_ingot:5, moonstone:1 }},
  {id:'divineHoe', name:'丰饶锄', icon:'🌾', desc:'作物产量 +50% + 15% 概率额外 +1 个', cost:{ emerald:2, moonstone:2, gold_ingot:10 }},
  {id:'divineCrown', name:'星辉冠', icon:'🌌', desc:'体力上限 +50 · 体力恢复速度翻倍', cost:{ stardust:1, diamond:3 }},
  {id:'divinePick', name:'星辰镐', icon:'⛏️', desc:'矿石掉落 +100% + 40% 概率额外 +1 个', cost:{ diamond:8, moonstone:4, iron_ingot:20 }},
  {id:'divineMeteorPick', name:'陨星镐', icon:'☄️', desc:'挖矿时 3% 概率掉落星尘（原 0.01%）', cost:{ stardust:1, emerald:1, sapphire:1 }},
  {id:'divineSunRobe', name:'太阳圣袍', icon:'☀️', desc:'所有出售价格 +50%（永久）', cost:{ stardust:2, emerald:3, sapphire:1 }},
];

function openEnchant(tier, activeTab){
  const isHigh = tier === 'high';
  const maxLv = isHigh ? 5 : 3;
  const tab = activeTab || 'pick';

  if (tab === 'divine'){
    const rows = DIVINE_ITEMS.map(d => {
      const owned = state[d.id];
      const can = !owned && Object.entries(d.cost).every(([id,n]) => hasItem(id,n));
      const costStr = Object.entries(d.cost).map(([id,n]) => {
        const ok = hasItem(id,n);
        return `<span style="color:${ok?'var(--green)':'var(--red)'}">${def(id).icon}${def(id).name}×${n}</span>`;
      }).join(' ');
      return `<div class="craftItem ${owned?'dis':(can?'':'dis')}" data-divine="${d.id}" style="grid-column:1/-1"><div class="ci" style="font-size:26px">${d.icon}</div><div class="cn"><b>${d.name}${owned?' ✅ 已拥有':''}</b><small>${d.desc}<br>${costStr}</small></div></div>`;
    }).join('');
    openModal(`<h2>✨ 神器合成<span>永久强化，只能合成一次</span></h2>
      <div style="color:var(--dim);font-size:12px;margin-bottom:12px">神器是永久投资，消耗大量宝石材料换取全局加成。</div>
      <div class="craftList">${rows}</div>
      <div class="modalFoot"><button class="btn" id="mClose">关闭</button></div>`,
      m => {
        m.querySelector('#mClose').onclick = closeModal;
        m.querySelectorAll('.craftItem[data-divine]').forEach(el => {
          el.onclick = () => {
            const d = DIVINE_ITEMS.find(x => x.id === el.dataset.divine);
            if (!d) return;
            if (state[d.id]){ log('❌ 已拥有该神器'); return; }
            if (!Object.entries(d.cost).every(([id,n]) => hasItem(id,n))){ log('❌ 材料不足'); return; }
            if (!confirm(`确定合成【${d.name}】？消耗所有材料，永久生效。`)) return;
            Object.entries(d.cost).forEach(([id,n]) => removeItem(id, n));
                        state[d.id] = true;
            if (d.id === 'divineCrown'){ state.staminaMax += 50; state.stamina = state.staminaMax; }
            logEgg(`✨ 成功合成神器【${d.name}】！${d.desc}`);
            save(); renderAll(); openEnchant(tier, 'divine');
          };
        });
      });
    return;
  }

  let toolLabel, ench, toolExists;
  if (tab === 'pick'){ toolLabel = PICKAXES[state.pickaxe].name; ench = state.tools[pickKey()]; toolExists = true; }
  else if (tab === 'axe'){ toolLabel = state.axe ? AXES[state.axe].name : '未拥有'; ench = getAxeEnch(); toolExists = state.axe > 0; }
  else { toolLabel = state.rod ? RODS[state.rod].name : '未拥有'; ench = getRodEnch(); toolExists = state.rod > 0; }

  let investedLv = 0;
  if (toolExists){
    for (const e of ENCH_KEYS){
      for (let lv = 0; lv < ench[e]; lv++) investedLv += (lv + 1) * 2 + (isHigh ? 3 : 0);
    }
  }
  const refineCost = isHigh ? {moonstone:3} : {diamond:5};

  const rows = toolExists ? ENCH_KEYS.map(e => {
    const cur = ench[e];
    const cost = (cur + 1) * 2 + (isHigh ? 3 : 0);
    const can = cur < maxLv && state.level > cost;
    return `<div class="craftItem ${can?'':'dis'}" data-ench="${e}" data-cost="${cost}"><div class="ci">${e==='eff'?'⚡':e==='for'?'🍀':'💰'}</div><div class="cn"><b>${ENCH_NAMES[e]} Lv.${cur} → ${cur+1} / ${maxLv}</b><small>消耗 ${cost} 等级 · ${ENCH_DESC[e][tab]}</small></div></div>`;
  }).join('') : `<div style="color:var(--dim);padding:24px;text-align:center">未拥有该工具</div>`;

  const refineCostStr = Object.entries(refineCost).map(([id,n]) => {
    const ok = hasItem(id,n);
    return `<span style="color:${ok?'var(--green)':'var(--red)'}">${def(id).icon}${def(id).name}×${n}</span>`;
  }).join(' ');
  const canRefine = toolExists && investedLv > 0 && Object.entries(refineCost).every(([id,n]) => hasItem(id,n));
  const refineHTML = toolExists ? `<div class="craftItem ${canRefine?'':'dis'}" data-refine="1" style="grid-column:1/-1;margin-top:8px;border-color:#a06cf0"><div class="ci" style="color:#a06cf0">♻️</div><div class="cn"><b>洗练附魔（重置本工具所有附魔）</b><small>消耗 ${refineCostStr} · 退还约 ${investedLv} 等级 · 已投入 ${investedLv} 级</small></div></div>` : '';

  openModal(`<h2>${isHigh?'✨ 高级附魔台':'🔮 低级附魔台'}<span>等级：${state.level} · 当前：${toolLabel}</span></h2>
    <div class="tabs">
      <div class="tab ${tab==='pick'?'active':''}" data-tab="pick">⛏️ 镐子</div>
      <div class="tab ${tab==='axe'?'active':''}" data-tab="axe">🪓 斧头</div>
      <div class="tab ${tab==='rod'?'active':''}" data-tab="rod">🎣 鱼竿</div>
      <div class="tab" data-tab="divine" style="color:#a06cf0">✨ 神器</div>
    </div>
    <div class="craftList">${rows}${refineHTML}</div>
    <div class="modalFoot"><button class="btn" id="mClose">关闭</button></div>`,
    m => {
      m.querySelector('#mClose').onclick = closeModal;
      m.querySelectorAll('.tab').forEach(el => { el.onclick = () => openEnchant(tier, el.dataset.tab); });
      m.querySelectorAll('.craftItem[data-ench]').forEach(el => {
        el.onclick = () => {
          if (el.classList.contains('dis')){ log('❌ 等级不足或已满级'); return; }
          const e = el.dataset.ench, cost = +el.dataset.cost;
          if (state.level <= cost){ log('❌ 等级不足'); return; }
          state.level -= cost;
          let need = xpNeed();
          while (state.xp >= need && state.level >= 0){
            state.xp -= need;
            state.level++;
            need = xpNeed();
          }
          if (tab === 'pick') state.tools[pickKey()][e]++;
          else if (tab === 'axe') state.tools[axeKey()][e]++;
          else state.tools[rodKey()][e]++;
          log(`✨ ${tab==='pick'?'镐子':tab==='axe'?'斧头':'鱼竿'} ${ENCH_NAMES[e]} 提升到 Lv.${ench[e]+1}！`);
          renderAll(); openEnchant(tier, tab);
        };
      });
      const refineBtn = m.querySelector('[data-refine]');
      if (refineBtn){
        refineBtn.onclick = () => {
          if (refineBtn.classList.contains('dis')){ log('❌ 材料不足或没有附魔可洗'); return; }
          if (!confirm('确定洗练？将重置所有附魔并退还等级。')) return;
          Object.entries(refineCost).forEach(([id,n]) => removeItem(id, n));
          state.level += investedLv;
          let need2 = xpNeed();
          while (state.xp >= need2){
            state.xp -= need2;
            state.level++;
            need2 = xpNeed();
          }
          if (tab === 'pick') state.tools[pickKey()] = {eff:0,for:0,pro:0};
          else if (tab === 'axe') state.tools[axeKey()] = {eff:0,for:0,pro:0};
          else state.tools[rodKey()] = {eff:0,for:0,pro:0};
          log(`♻️ 洗练完成，退还 ${investedLv} 等级`);
          renderAll(); openEnchant(tier, tab);
        };
      }
    });
}

function openChest(){
  const BASE_ORDER = Object.keys(DYE_BASES);
  const COLOR_ORDER = DYE_RECIPES.map(r => r.color);
  const sortKey = (id) => {
    const parts = id.replace('dyed_', '').split('_');
    const base = parts[0];
    const color = parts.slice(1).join('_');
    const bi = BASE_ORDER.indexOf(base);
    const ci = COLOR_ORDER.indexOf(color);
    return (bi < 0 ? 999 : bi) * 100 + (ci < 0 ? 999 : ci);
  };
  const inBag = Object.entries(state.inv).filter(([id,n]) => id.startsWith('dyed_') && n > 0).sort((a,b) => sortKey(a[0]) - sortKey(b[0]));
  const inChest = Object.entries(state.chest).filter(([,n]) => n > 0).sort((a,b) => sortKey(a[0]) - sortKey(b[0]));
  const bagHTML = inBag.length ? inBag.map(([id,n]) => {
    const it = def(id);
    const already = (state.chest[id]||0) >= 1;
    return `<div class="craftItem ${already?'dis':''}" data-store="${id}"><div class="ci" style="filter:drop-shadow(0 0 4px ${it.color||'#ccc'})">${it.icon}</div><div class="cn"><b>${it.name} ×${n}</b><small>${already ? '<span style="color:var(--gold)">已收藏</span>' : '点击永久收藏（不可取出）'}</small></div></div>`;
  }).join('') : `<div style="color:var(--dim);padding:16px;text-align:center;font-size:12px">背包里还没有染色品</div>`;
  const chestHTML = inChest.length ? inChest.map(([id]) => {
    const it = def(id);
    return `<div class="craftItem" style="cursor:default"><div class="ci" style="filter:drop-shadow(0 0 4px ${it.color||'#ccc'})">${it.icon}</div><div class="cn"><b>${it.name}</b><small>已永久收藏 🔒</small></div></div>`;
  }).join('') : `<div style="color:var(--dim);padding:16px;text-align:center;font-size:12px">箱子是空的</div>`;
  const total = inChest.length;
  const totalMax = Object.keys(DYE_BASES).length * DYE_RECIPES.length;
  openModal(`<h2>📦 收藏箱<span>已收藏 ${total} / ${totalMax}</span></h2>
    <div style="color:#a06cf0;font-size:11px;margin-bottom:10px;font-style:italic">"每件染色品的唯一收藏——放入后不可取出。"</div>
    <h3 style="font-size:12px;color:var(--dim);margin:12px 0 6px">背包中的染色品</h3><div class="craftList">${bagHTML}</div>
    <h3 style="font-size:12px;color:var(--dim);margin:14px 0 6px">已收藏（永久）</h3><div class="craftList">${chestHTML}</div>
    <div class="modalFoot"><button class="btn" id="mClose">关闭</button></div>`,
    m => {
      m.querySelector('#mClose').onclick = closeModal;
      m.querySelectorAll('.craftItem[data-store]').forEach(el => {
        el.onclick = () => {
          const id = el.dataset.store;
          if ((state.chest[id]||0) >= 1){ log('❌ 该染色品已经收藏过了'); return; }
          const n = state.inv[id] || 0;
          if (n <= 0) return;
          removeItem(id, 1);
          state.chest[id] = 1;
          log(`📦 永久收藏：${def(id).name}（不可取出）`);
          save(); renderAll(); openChest();
        };
      });
    });
}

function openFishing(){
  if (!state.rod){ log('🎣 你需要先在商店购买鱼竿'); return; }
  const rod = RODS[state.rod];
  const ench = getRodEnch();
  openModal(`<h2>🎣 钓鱼<span>${rod.name} · 空钩率 ${(rod.miss*100).toFixed(0)}%</span></h2>
    <div style="text-align:center;padding:24px 0;font-size:48px" id="fishEmoji">🌊</div>
    <div style="text-align:center;color:var(--dim)" id="fishMsg">准备好了吗？</div>
    <div class="modalFoot"><button class="btn gold" id="mCast">抛竿！</button><button class="btn" id="mClose">关闭</button></div>`,
    m => {
      m.querySelector('#mClose').onclick = closeModal;
      m.querySelector('#mCast').onclick = () => {
        const btn = m.querySelector('#mCast'), emo = m.querySelector('#fishEmoji'), msg = m.querySelector('#fishMsg');
        btn.disabled = true; btn.textContent = '等待中…';
        emo.textContent = '🎣'; msg.textContent = '浮标漂在水面上…';
        let t = 0;
        const waitTime = 4 + Math.random() * 6;
        const windowSec = 0.75 + ench.eff * 0.1;
        const iv = setInterval(() => {
          t += 0.5;
          emo.textContent = t % 1 ? '🎣' : '🌊';
          if (t >= waitTime){
            clearInterval(iv);
            emo.textContent = '❗'; msg.textContent = '上钩了！快点击！';
            const ok = setTimeout(() => { emo.textContent = '💨'; msg.textContent = '鱼跑了…'; btn.disabled = false; btn.textContent = '再抛一次'; emo.onclick = null; }, windowSec * 1000);
            const handler = () => {
              clearTimeout(ok);
              const missRate = state.divineRod ? rod.miss * 0.5 : rod.miss;
              if (Math.random() < missRate){ emo.textContent = '💨'; msg.textContent = '空钩！什么也没钓到…'; log('🎣 空钩！'); btn.disabled = false; btn.textContent = '再抛一次'; emo.onclick = null; return; }
              let fishTable = rod.table;
              if (state.divineRod){
                fishTable = rod.table.map(([fid, w]) => fid === 'fish_legend' ? [fid, w + 5] : [fid, w]);
              }
              const id = weightedPick(fishTable);
              addItem(id, 1); gainXp(8); progressTask('fish'); unlockCodex('fish', id);
              emo.textContent = def(id).icon;
              msg.textContent = `钓到了 ${def(id).name}！`;
              log(`🎣 钓到 ${def(id).name}`);
              btn.disabled = false; btn.textContent = '再抛一次';
              emo.onclick = null;
            };
            emo.onclick = handler;
          }
        }, 500);
      };
    });
}
